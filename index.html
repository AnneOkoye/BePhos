<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#30533E">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Merroes">
<title>Merroes. Your goals. Your pace. Your people.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://nvgzejircugthcacidol.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
<style>
:root{
  --bg:#FFFFFF; --bg-alt:#F4F6F2; --card:#FFFFFF;
  --ink:#1E2A1E; --ink-soft:#6B7A66; --ink-faint:#9AA894;
  --green:#4F8A4A; --green-dark:#3D6E3A; --green-light:#E3F1DE;
  --terracotta:#D98B4A; --terracotta-light:#FBE8D5;
  --rose:#E893A0; --rose-light:#FCE6EA;
  --gold:#E8B23D; --gold-light:#FCEFCF;
  --border:#E5E9DE; --radius:18px;
  --shadow:0 1px 2px rgba(20,20,10,.05), 0 10px 26px -14px rgba(20,20,10,.18);
  --serif:'EB Garamond',serif; --sans:'Inter',sans-serif;
  --shell-w:620px;
}
@media(min-width:768px){ :root{ --shell-w:760px; } }
@media(min-width:1080px){ :root{ --shell-w:960px; } }
@media(min-width:1440px){ :root{ --shell-w:1180px; } }
@media(min-width:1800px){ :root{ --shell-w:1320px; } }

*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;letter-spacing:0em;margin:0;}
p{margin:0;line-height:1.55;}
a{color:inherit;}
.container{max-width:1120px;margin:0 auto;padding:0 28px;}
@media(min-width:1440px){ .container{max-width:1320px;} }
@media(min-width:1800px){ .container{max-width:1540px;} }
@media(min-width:2200px){ .container{max-width:1760px;} }
.app-shell{max-width:var(--shell-w);margin:0 auto;padding:28px 20px 110px;min-height:100vh;}
.marketing-shell{padding-bottom:60px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.card + .card{margin-top:14px;}
.section{margin-top:28px;}
.muted{color:var(--ink-soft);}
.faint{color:var(--ink-faint);font-size:12.5px;}
.small{font-size:13px;}
.center{text-align:center;}
.row{display:flex;align-items:center;}
.row.between{justify-content:space-between;}
.row.gap{gap:10px;}
.row.wrap{flex-wrap:wrap;}
.stack{display:flex;flex-direction:column;}
.stack.gap8>*+*{margin-top:8px;}
.stack.gap12>*+*{margin-top:12px;}
.stack.gap16>*+*{margin-top:16px;}
.stack.gap20>*+*{margin-top:20px;}
hr.rule{border:none;border-top:1px solid var(--border);margin:14px 0;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:10px;
  font-weight:600;font-size:14.5px;cursor:pointer;border:1px solid transparent;transition:.15s;font-family:var(--sans);}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-outline{background:transparent;border-color:var(--ink);color:var(--ink);}
.btn-outline:hover{background:var(--green-light);}
.btn-block{width:100%;}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:8px;}
.btn-ghost{background:transparent;color:var(--green);border:none;padding:6px 8px;font-weight:700;}
.btn-ghost:hover{text-decoration:underline;}
.btn-danger{background:transparent;color:#a24138;border:1px solid #e3c3bb;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
button{font-family:var(--sans);}

input,textarea,select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
  background:#fff;font-family:var(--sans);font-size:14.5px;color:var(--ink);}
input:focus,textarea:focus,select:focus{outline:2px solid var(--green);outline-offset:1px;}
label.field-label{font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;display:block;}
textarea{resize:vertical;min-height:70px;}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;}
.badge-green{background:var(--green-light);color:var(--green);}
.badge-gold{background:var(--gold-light);color:#8a6a26;}
.badge-rose{background:var(--rose-light);color:#a24f53;}
.badge-terra{background:var(--terracotta-light);color:#a1552a;}
.badge-grey{background:#EFEBDD;color:var(--ink-soft);}

.progress-track{height:6px;background:var(--border);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green-dark),var(--green));transition:width .4s ease;}

body.onb-atmosphere{
  background:
    radial-gradient(ellipse 820px 620px at 12% -8%, rgba(232,178,61,.15), transparent 60%),
    radial-gradient(ellipse 720px 720px at 112% 18%, rgba(79,138,74,.15), transparent 55%),
    radial-gradient(ellipse 640px 520px at 45% 118%, rgba(232,147,160,.12), transparent 55%),
    var(--bg-alt);
}

.dots{display:flex;align-items:center;gap:0;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex:none;position:relative;transition:background .3s;}
.dot.on{background:var(--green);}
.dot:not(:last-child)::after{content:'';display:block;position:absolute;left:100%;top:50%;transform:translateY(-50%);width:14px;height:2px;background:var(--border);transition:background .3s;}
.dot.on:not(:last-child)::after{background:var(--green);}

.icon-badge{width:46px;height:46px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;font-size:21px;flex:none;}

.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.status-green{background:#3E8E5A;} .status-yellow{background:#D8A73B;} .status-red{background:#C9584A;}

.avatar{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;flex:none;}

.top-onboard{position:sticky;top:0;background:rgba(244,246,242,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:6px;padding-bottom:14px;z-index:5;}
.back-link{cursor:pointer;color:var(--ink-soft);font-size:13.5px;font-weight:600;}
.back-link:hover{color:var(--ink);}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:6px;}

.choice-card{border:1.5px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:.12s;background:#fff;}
.choice-card:hover{border-color:var(--ink-faint);}
.choice-card.selected{border-color:var(--green);background:var(--green-light);}
.grid{display:grid;gap:12px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:560px){.grid-3{grid-template-columns:1fr 1fr;}.grid-4{grid-template-columns:1fr 1fr;}}

.pill-toggle{display:flex;gap:8px;flex-wrap:wrap;}
.pill{padding:8px 14px;border-radius:999px;border:1.5px solid var(--border);font-size:13.5px;font-weight:600;cursor:pointer;background:#fff;color:var(--ink-soft);}
.pill.active{background:var(--green);border-color:var(--green);color:#fff;}

.switch{width:42px;height:24px;border-radius:999px;background:var(--border);position:relative;cursor:pointer;flex:none;transition:.15s;}
.switch.on{background:var(--green);}
.switch .knob{width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25);}
.switch.on .knob{left:21px;}

.week-track{display:flex;justify-content:space-between;margin:6px 0;}
.week-track .wk{font-size:16px;}
.checkline{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);}
.checkline:last-child{border-bottom:none;}
.checkline .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);flex:none;margin-top:2px;}
.checkline.done .box{background:var(--green);border-color:var(--green);}

.msg{padding:10px 0;border-bottom:1px solid var(--border);}
.msg:last-child{border-bottom:none;}
.msg .who{font-weight:700;font-size:13px;}
.msg .when{color:var(--ink-faint);font-size:11.5px;font-weight:500;}

.bottom-nav-wrap{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);z-index:50;}
.bottom-nav{max-width:var(--shell-w);margin:0 auto;display:flex;justify-content:space-around;padding:8px 6px;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ink-soft);cursor:pointer;
  padding:6px 10px;border-radius:9px;font-weight:600;}
.nav-item .ni-ico{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;}
.nav-item.active{color:var(--green);background:var(--green-light);}
.side-nav{display:none;}
@media(min-width:768px){
  .bottom-nav-wrap{display:none;}
  .side-nav{
    display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;width:220px;
    background:#fff;border-right:1px solid var(--border);padding:26px 16px;z-index:50;gap:4px;
  }
  .side-nav .side-brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-weight:700;font-size:19px;
    cursor:pointer;margin-bottom:28px;padding:0 8px;}
  .side-nav .side-item{display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:600;color:var(--ink-soft);
    cursor:pointer;padding:11px 12px;border-radius:10px;}
  .side-nav .side-item .ni-ico{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;}
  .side-nav .side-item.active{color:var(--green);background:var(--green-light);}
  .side-nav .side-item:hover:not(.active){background:var(--bg-alt);}
  body:has(.side-nav) .app-shell{margin-left:220px;max-width:calc(var(--shell-w) - 40px);padding-bottom:28px;}
}

.subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.subtab{padding:7px 13px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;border:1px solid var(--border);background:#fff;}
.subtab.active{background:var(--green);color:#fff;border-color:var(--green);}

#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:var(--shadow);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

.jump-nav{display:none;position:fixed;top:14px;right:14px;z-index:150;background:#fff;border:1px solid var(--border);border-radius:10px;
  padding:8px 10px;box-shadow:var(--shadow);font-size:12px;}
.jump-nav select{width:auto;padding:6px 8px;font-size:12px;border-radius:7px;}
.jump-nav .jn-label{font-weight:700;color:var(--ink-soft);margin-right:6px;}

.hero-wrap{background:radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,154,62,.16), transparent 60%),
  radial-gradient(ellipse 700px 500px at 100% 0%, rgba(31,61,46,.10), transparent 55%),
  linear-gradient(180deg,#F6F3EA 0%,var(--bg) 100%);}
.hero-flex{display:flex;align-items:center;gap:44px;margin-top:20px;}
.hero-text{flex:1.05;}
.hero-visual{flex:0.95;}
@media(max-width:820px){.hero-flex{flex-direction:column;gap:28px;}.hero-visual{width:100%;max-width:420px;}}
.preview-card{background:#fff;border-radius:18px;border:1px solid var(--border);box-shadow:0 4px 8px rgba(20,20,10,.06), 0 24px 48px -20px rgba(20,20,10,.22);overflow:hidden;position:relative;}
.preview-glow{position:absolute;width:200px;height:200px;border-radius:50%;background:var(--gold-light);top:-50px;right:-50px;z-index:-1;opacity:.8;filter:blur(4px);}
.preview-topbar{display:flex;align-items:center;gap:6px;padding:12px 16px;border-bottom:1px solid var(--border);}
.preview-dot{width:7px;height:7px;border-radius:50%;background:#DDD8C8;}
.preview-body{padding:18px;}
.mini-avatar{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;border:2px solid #fff;margin-left:-8px;}
.mini-avatar:first-child{margin-left:0;}
.hero-mock{background:#fff;border-radius:16px;border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;position:relative;}
.hero-circle{position:absolute;width:230px;height:230px;border-radius:50%;background:var(--gold-light);top:-40px;right:-60px;z-index:-1;}
.mock-bar{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--border);}
.mock-dot{width:8px;height:8px;border-radius:50%;background:#DDD8C8;}
.mock-body{padding:16px;}

nav.top{padding:20px 0;}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-weight:700;font-size:19px;cursor:pointer;}
.brand .mark{width:26px;height:26px;color:var(--green);}
.navlinks{display:flex;gap:28px;font-size:14px;color:var(--ink-soft);font-weight:600;}
.navlinks span{cursor:pointer;}
.navlinks span:hover{color:var(--ink);}

.compare-before{background:var(--rose-light);border:none;}
.compare-after{background:var(--green-light);border:none;}
.compare-grid{gap:14px;}
.compare-grid .small{padding:3px 0;}
.journey-row{display:flex;align-items:flex-start;justify-content:center;flex-wrap:wrap;gap:10px;text-align:center;}
.journey-stage{width:150px;}
.journey-arrow{align-self:center;color:var(--ink-faint);font-size:18px;padding-top:20px;}
@media(max-width:640px){
  .journey-arrow{display:none;}
  .journey-stage{width:44%;}
}

.bold-hero{background:var(--green);color:#fff;padding:52px 24px 46px;text-align:center;}
.bold-hero .brand-row{display:flex;align-items:center;justify-content:space-between;max-width:1120px;margin:0 auto 40px;}
.bold-hero .brand-row .brand{color:#fff;}
.bold-hero .brand-row .brand .mark{color:#fff;}
.bold-hero .brand-row .btn-outline{border-color:#fff;color:#fff;}
.bold-hero .brand-row .btn-outline:hover{background:rgba(255,255,255,.12);}
.bold-hero h1{font-size:40px;line-height:1.16;color:#fff;max-width:720px;margin:0 auto;}
.bold-hero .sub{color:#DCE7DF;font-size:16px;margin-top:16px;max-width:520px;margin-left:auto;margin-right:auto;}
@media(max-width:640px){.bold-hero h1{font-size:29px;}}

.phone-frame{width:100%;max-width:300px;margin:0 auto;background:#14201A;border-radius:38px;padding:12px 10px;box-shadow:0 30px 60px -22px rgba(0,0,0,.45);}
.phone-frame .notch{width:110px;height:20px;background:#14201A;border-radius:0 0 14px 14px;margin:0 auto 6px;position:relative;top:6px;}
.phone-screen{background:#fff;border-radius:26px;overflow:hidden;min-height:360px;}
.phone-slide{padding:56px 20px 60px;text-align:center;}
.phone-slide.tint-green{background:var(--green);color:#fff;}
.phone-slide.tint-cream{background:var(--bg);}
.phone-slide h2{font-size:26px;line-height:1.2;max-width:420px;margin:0 auto 26px;}
.phone-slide.tint-green h2{color:#fff;}
.phone-slide.tint-cream h2{color:var(--ink);}

.stat-badge-row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:22px 0 6px;}
.stat-badge{width:128px;height:128px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;color:#fff;}
.stat-badge .num{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1.15;}
.stat-badge .lbl{font-size:10.5px;margin-top:4px;opacity:.92;line-height:1.3;}

/* ---- Marketing landing page (desktop-first website, not app-shell) ---- */
.site-nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0;}
.site-nav .navbtns{display:flex;gap:10px;}
.marketing-section{padding:44px 0;border-bottom:1px solid var(--border);}
.marketing-section:last-of-type{border-bottom:none;}
.marketing-section.tint{background:var(--bg-alt);}
.section-title{font-size:30px;text-align:center;margin-bottom:8px;}
.section-sub{text-align:center;color:var(--ink-soft);font-size:15px;max-width:560px;margin:0 auto 22px;}
.hero-section{padding:70px 0 60px;text-align:center;position:relative;}
@keyframes rootReach{0%,100%{stroke-dashoffset:60;opacity:.15;}50%{stroke-dashoffset:0;opacity:.5;}}
@keyframes barCharge{0%,100%{opacity:.4;transform:scaleY(.45);}50%{opacity:1;transform:scaleY(1);}}
.growth-bar-fill{transform-origin:bottom;animation:barCharge 2.2s ease-in-out infinite;}
.collection-clearing{display:flex;align-items:flex-end;justify-content:center;gap:18px;padding:10px 0 16px;border-bottom:2px solid var(--border);}
.clearing-tree{width:64px;}
.clearing-tree img{width:100%;display:block;}
.reveal-stage{position:relative;width:180px;height:180px;margin:20px auto 6px;display:flex;align-items:center;justify-content:center;}
.reveal-ambient-glow{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,var(--gold-light) 0%,transparent 70%);opacity:.55;filter:blur(18px);animation:glowPulse 3.5s ease-in-out infinite;animation-delay:1.1s;}
@keyframes glowPulse{0%,100%{opacity:.5;}50%{opacity:.95;}}
.reveal-glow-burst{position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,#FFF6DD 0%,var(--gold) 42%,transparent 72%);animation:revealGlowBurst 1s ease-out forwards;}
.reveal-ring{position:absolute;inset:6px;border:3px solid var(--gold);border-radius:50%;animation:revealRing 1s ease-out forwards;}
.reveal-tree{position:relative;z-index:2;animation:revealPop .9s cubic-bezier(.34,1.56,.64,1) both;}
.reveal-sparkle{position:absolute;top:50%;left:50%;width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:0;animation:sparkleOut 1s ease-out forwards;}
@keyframes revealPop{0%{transform:scale(.2) rotate(-8deg);opacity:0;}55%{transform:scale(1.15) rotate(3deg);opacity:1;}75%{transform:scale(.94) rotate(-1deg);}100%{transform:scale(1) rotate(0);}}
@keyframes revealGlowBurst{0%{transform:scale(.3);opacity:0;}40%{opacity:.9;}100%{transform:scale(1.7);opacity:0;}}
@keyframes revealRing{0%{transform:scale(.4);opacity:.8;}100%{transform:scale(2.3);opacity:0;}}
@keyframes sparkleOut{0%{transform:translate(0,0) scale(0);opacity:0;}30%{opacity:1;}100%{transform:translate(var(--sx),var(--sy)) scale(1);opacity:0;}}
.hero-headline{font-size:44px;line-height:1.2;max-width:820px;margin:0 auto 32px;}
@media(max-width:720px){.hero-headline{font-size:30px;}}
.hero-avatars{display:flex;justify-content:center;gap:26px;margin:0 auto 36px;flex-wrap:wrap;}
.hero-avatar-item{display:flex;flex-direction:column;align-items:center;gap:8px;}
.hero-avatar-item .tree{font-size:22px;}
.hero-avatar-item .circle{width:56px;height:56px;border-radius:50%;background:var(--green-light);border:2px solid var(--green);}
.hero-visual-box{max-width:600px;margin:0 auto 32px;position:relative;background:linear-gradient(180deg,var(--green-light) 0%,var(--bg) 100%);border-radius:24px;padding:36px 20px 30px;overflow:hidden;box-shadow:var(--shadow);}
.hero-trees-row{position:relative;display:flex;justify-content:center;flex-wrap:wrap;gap:20px;font-size:34px;}
.hero-tree-item{position:relative;z-index:1;}
.hero-roots-line{position:relative;height:2px;max-width:280px;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--terracotta) 20%,var(--gold) 50%,var(--terracotta) 80%,transparent);opacity:.55;}
@keyframes treeSway{0%,100%{transform:rotate(-5deg);}50%{transform:rotate(5deg);}}
.tree-anim{display:inline-block;transform-origin:bottom center;animation:treeSway 2.8s ease-in-out infinite;}
@keyframes treeMaterialize{0%{opacity:0;transform:scale(.82);filter:blur(3px);}100%{opacity:1;transform:scale(1);filter:blur(0);}}
.tree-materializing{animation:treeMaterialize .7s cubic-bezier(.34,1.4,.64,1) .05s both, treeSway 2.8s ease-in-out .75s infinite;}
@keyframes cheerFloat{0%{opacity:0;transform:translateY(6px) scale(.7);}25%{opacity:1;transform:translateY(-4px) scale(1);}80%{opacity:1;}100%{opacity:0;transform:translateY(-30px) scale(.9);}}
.cheer-bubble{position:absolute;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;color:#fff;pointer-events:none;animation:cheerFloat 2.1s ease-out forwards;box-shadow:0 2px 6px rgba(0,0,0,.18);z-index:6;}
@keyframes cheerCaptionIn{0%{opacity:0;transform:translate(-50%,4px);}20%{opacity:1;transform:translate(-50%,0);}80%{opacity:1;}100%{opacity:0;transform:translate(-50%,-6px);}}
.cheer-caption{position:absolute;left:50%;white-space:nowrap;font-size:11px;font-weight:700;color:var(--green-dark);background:rgba(255,255,255,.94);padding:4px 10px;border-radius:20px;pointer-events:none;animation:cheerCaptionIn 2.4s ease-out forwards;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:6;}
.tree-shatter-frag{position:absolute;background-repeat:no-repeat;will-change:transform,opacity;transform-style:preserve-3d;}
@keyframes treeShatterFly{
  0%{transform:translate3d(0,0,0) rotateX(0) rotateY(0) rotateZ(0);opacity:1;}
  70%{opacity:1;}
  100%{transform:translate3d(var(--dx),var(--dy),var(--dz)) rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz));opacity:0;}
}
.identity-layout{display:flex;gap:24px;align-items:flex-start;}
@media(max-width:900px){.identity-layout{flex-direction:column;}}
.goalpicker-layout{display:flex;gap:24px;align-items:flex-start;}
@media(max-width:860px){.goalpicker-layout{flex-direction:column;} .goalpicker-layout>div:last-child{position:static !important;}}
.identity-col{flex:1;min-width:0;}
.tree-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
@media(max-width:520px){.tree-grid{grid-template-columns:repeat(4,1fr);}}
.tree-grid .choice-card{padding:10px 4px;text-align:center;}
.plaque-card{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--gold-light),var(--green-light));border:1px solid var(--gold);position:relative;overflow:hidden;}
.plaque-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 18% 15%, rgba(255,255,255,.55), transparent 55%);pointer-events:none;}
.hero-lines{max-width:600px;margin:0 auto 10px;font-size:16px;color:var(--ink-soft);}
.hero-lines b{color:var(--ink);font-weight:600;}
.cta-block{max-width:460px;margin:36px auto 0;text-align:center;}
.cta-block .btn{padding:16px 28px;font-size:15px;}
.community-card{border:1px solid var(--border);}
.community-card-accent{height:5px;width:100%;}
.community-card-highlight{margin-top:16px;padding:10px 14px;border-left:3px solid;font-size:14px;font-style:italic;color:var(--ink-soft);background:var(--bg-alt);border-radius:0 8px 8px 0;}
.tm-showcase{display:flex;gap:36px;align-items:center;max-width:820px;margin:0 auto;flex-wrap:wrap;justify-content:center;}
.tm-showcase-visual{flex:none;}
.tm-showcase-facts{flex:1;min-width:260px;display:flex;flex-direction:column;gap:18px;}
.tm-fact .eyebrow{color:var(--green-dark);}
@media(max-width:720px){.tm-showcase{flex-direction:column;text-align:center;} .tm-showcase-facts{text-align:left;}}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:1000px;margin:0 auto;}
.feature-grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media(min-width:1440px){ .feature-grid{max-width:1180px;} }
@media(min-width:1800px){ .feature-grid{max-width:1380px;} }
@media(max-width:900px){.feature-grid,.feature-grid.cols-4{grid-template-columns:1fr 1fr;}}
@media(max-width:560px){.feature-grid,.feature-grid.cols-4{grid-template-columns:1fr;}}
.feature-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:26px 22px;box-shadow:var(--shadow);text-align:center;transition:transform .15s,box-shadow .15s;}
.feature-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -12px rgba(20,20,10,.2);}
.feature-icon-circle{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:23px;margin:0 auto 14px;}
.feature-card .num{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--terracotta);letter-spacing:.06em;}
.feature-card h3{font-size:17px;margin-top:8px;}
.feature-card p{font-size:13.5px;color:var(--ink-soft);margin-top:10px;line-height:1.6;}
.compare-2col{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:900px;margin:0 auto;}
@media(max-width:720px){.compare-2col{grid-template-columns:1fr;}}
.solo-first-layout{display:grid;grid-template-columns:1fr 1.3fr;gap:20px;max-width:900px;margin:0 auto;}
@media(max-width:720px){.solo-first-layout{grid-template-columns:1fr;}}
#dashboardTreeVisual{position:relative;overflow:visible;}
.rain-drop{position:absolute;top:-16px;width:5px;height:26px;border-radius:3px;
  background:linear-gradient(180deg,rgba(125,175,220,0) 0%,rgba(110,165,215,.95) 55%,rgba(80,140,200,.95) 100%);
  animation:rainFall 1.3s ease-in forwards;pointer-events:none;z-index:5;box-shadow:0 0 4px rgba(90,150,210,.5);}
@keyframes rainFall{
  0%{transform:translateY(0);opacity:0;}
  12%{opacity:1;}
  100%{transform:translateY(180px);opacity:0;}
}
.tree-watered{animation:treeGlowAbsorb 2.2s ease-out;}
@keyframes treeGlowAbsorb{
  0%{filter:drop-shadow(0 0 0px rgba(140,200,120,0)) brightness(1);}
  40%{filter:drop-shadow(0 0 30px rgba(150,210,130,.9)) brightness(1.28);}
  100%{filter:drop-shadow(0 0 0px rgba(140,200,120,0)) brightness(1);}
}
.tree-wilt-mild{filter:saturate(.85) brightness(.97);transform:rotate(-1.5deg);transition:filter 1s,transform 1s;}
.tree-wilt-deep{filter:saturate(.62) brightness(.90);transform:rotate(-3.5deg) translateY(3px);transition:filter 1s,transform 1s;animation:none !important;}

/* Canopy Rustle - fires when opening the dashboard after a recent completion */
.tree-rustle{animation:canopyRustle 0.9s ease-in-out !important;}
@keyframes canopyRustle{
  0%,100%{transform:rotate(0deg);}
  20%{transform:rotate(-4deg);}
  40%{transform:rotate(3deg);}
  60%{transform:rotate(-2.5deg);}
  80%{transform:rotate(1.5deg);}
}
.golden-seed{position:absolute;bottom:6px;width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle,#FFEDB0 0%,#E8B23D 70%);box-shadow:0 0 6px 1px rgba(232,178,61,.7);
  animation:seedDrop 1.1s ease-in forwards;pointer-events:none;}
@keyframes seedDrop{
  0%{transform:translateY(-46px) scale(0.6);opacity:0;}
  15%{opacity:1;}
  85%{opacity:1;}
  100%{transform:translateY(0) scale(1);opacity:.9;}
}

/* Steam Evaporation - the recovery-specific version of watering, after a deep wilt */
.recovery-sunflash{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,244,214,.9) 0%,rgba(255,244,214,0) 65%);
  animation:sunFlash 1.6s ease-out forwards;}
@keyframes sunFlash{0%{opacity:0;transform:scale(.6);}30%{opacity:1;}100%{opacity:0;transform:scale(1.3);}}
.steam-wisp{position:absolute;bottom:20px;width:5px;height:22px;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 100%);
  filter:blur(2px);animation:steamRise 1.8s ease-out forwards;pointer-events:none;}
@keyframes steamRise{0%{transform:translateY(0) scaleY(1);opacity:0;}20%{opacity:.8;}100%{transform:translateY(-38px) scaleY(1.6);opacity:0;}}

/* Pruning - a clean swipe reveal from wilted to restored */
.tree-pruned{animation:pruneSwipe 0.6s ease-out;}
@keyframes pruneSwipe{
  0%{clip-path:inset(0 100% 0 0);filter:saturate(.6) brightness(.9);}
  100%{clip-path:inset(0 0 0 0);filter:saturate(1) brightness(1);}
}
.fresh-bud{position:absolute;width:5px;height:5px;border-radius:50%;background:#8FCF6E;
  animation:budPop .7s ease-out forwards;pointer-events:none;}
@keyframes budPop{0%{transform:scale(0);opacity:0;}50%{opacity:1;}100%{transform:scale(1);opacity:0;}}

/* Scar knot - a small permanent mark near the base once a real recovery has happened */
.scar-knot{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:9px;height:7px;
  border-radius:50% 50% 45% 45%;background:#6B4A32;box-shadow:inset 0 -1px 1px rgba(0,0,0,.3);opacity:.85;}
.root-network-sky{margin:-28px -20px 0;padding:28px 20px 40px;position:relative;overflow:hidden;transition:background 1s;}
.root-network-sky.day{background:linear-gradient(180deg,#CFE8F5 0%,#F3F8EF 65%);}
.root-network-sky.night{background:linear-gradient(180deg,#101830 0%,#1E2A46 60%);}
.root-network-sky.night .eyebrow,.root-network-sky.night h2,.root-network-sky.night .back-link{color:#E8ECF5;}
.celestial-sun{position:absolute;top:18px;right:26px;width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle,#FFE9A8 0%,#F7C948 60%,rgba(247,201,72,0) 75%);
  box-shadow:0 0 24px 8px rgba(247,201,72,.55);animation:sunPulse 4s ease-in-out infinite;}
@keyframes sunPulse{0%,100%{transform:scale(1);opacity:.9;}50%{transform:scale(1.08);opacity:1;}}
.celestial-moon{position:absolute;top:20px;right:30px;width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#F5F3E8 0%,#D9D6C8 70%);
  box-shadow:0 0 18px 5px rgba(230,228,210,.4);animation:moonGlow 5s ease-in-out infinite;}
@keyframes moonGlow{0%,100%{opacity:.85;}50%{opacity:1;}}
.celestial-star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:starTwinkle 2.4s ease-in-out infinite;}
@keyframes starTwinkle{0%,100%{opacity:.25;}50%{opacity:1;}}
.goal-timeline-block{margin-bottom:20px;}
.goal-timeline-block:last-child{margin-bottom:0;}
.timeline-list{margin-top:10px;padding-left:14px;border-left:2px solid var(--border);}
.timeline-item{position:relative;padding:7px 0 7px 16px;}
.timeline-dot{position:absolute;left:-21px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--green);}
.compare-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:30px;box-shadow:var(--shadow);}
.compare-card h3{font-size:19px;margin-bottom:6px;}
.compare-card .tagline{color:var(--ink-soft);font-size:13.5px;margin-bottom:18px;}
.compare-card ul{list-style:none;margin:0;padding:0;}
.compare-card li{font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--border);}
.compare-card li:last-child{border-bottom:none;}
.stack-cards{max-width:820px;margin:0 auto;display:flex;flex-direction:column;}
.stack-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:30px 34px;box-shadow:var(--shadow);}
.stack-card h3{font-size:20px;display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.stack-card .tagline{color:var(--ink-soft);font-size:14px;margin-bottom:16px;}
.diamond-list{list-style:none;margin:0;padding:0;}
.diamond-list li{font-size:13.5px;padding:5px 0 5px 18px;position:relative;color:var(--ink);line-height:1.5;}
.diamond-list li:before{content:'\25C6';position:absolute;left:0;color:var(--terracotta);font-size:9px;top:9px;}
.stack-divider{text-align:center;color:var(--ink-soft);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:26px 0;}
.stack-divider .line{display:inline-block;width:60px;height:1px;background:var(--border);vertical-align:middle;margin:0 12px;}
.forest-strip{max-width:1000px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px;}
.forest-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;text-align:center;}
.forest-stage{flex:1;min-width:56px;}
.forest-stage .emoji{font-size:22px;}
.forest-stage .lbl{font-size:12px;font-weight:600;margin-top:6px;}
.forest-stage .wk{font-size:10.5px;color:var(--ink-faint);margin-top:2px;}
.tree-timeline{max-width:480px;margin:0 auto;}
.tree-stage{display:flex;gap:16px;position:relative;padding-bottom:26px;}
.tree-stage:last-child{padding-bottom:0;}
.tree-stage:not(:last-child):before{content:'';position:absolute;left:19px;top:38px;bottom:-6px;width:2px;background:var(--border);}
.tree-stage .stage-icon{font-size:26px;width:40px;text-align:center;flex-shrink:0;position:relative;z-index:1;}
.tree-stage .stage-wk{font-weight:700;font-size:14px;color:var(--ink);}
.tree-stage .stage-desc{font-size:13px;color:var(--ink-soft);margin-top:2px;}
.pricing-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:720px;margin:0 auto 32px;}
@media(max-width:640px){.pricing-grid{grid-template-columns:1fr;}}
.pricing-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:30px;text-align:center;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;}
.pricing-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -12px rgba(20,20,10,.2);}
.pricing-card.best{border-color:var(--green);}
.pricing-card .plan-name{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:.02em;}
.pricing-card .plan-tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--terracotta);}
.pricing-card .price{font-family:var(--serif);font-size:34px;margin:10px 0 2px;}
.pricing-card .price span{font-size:14px;color:var(--ink-soft);font-family:var(--sans);}
.pricing-card .note{font-size:12.5px;color:var(--ink-soft);margin-top:12px;}
.includes-list{max-width:420px;margin:0 auto;text-align:center;color:var(--ink-soft);font-size:13.5px;line-height:2;}
.chip-row-3{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:32px;}
.chip-row-3 .chip-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.site-footer{padding:56px 0 30px;}
.footer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;max-width:1000px;margin:0 auto 30px;}
.footer-grid.footer-grid-3{grid-template-columns:repeat(3,1fr);max-width:760px;}
@media(max-width:720px){.footer-grid{grid-template-columns:1fr 1fr;}.footer-grid.footer-grid-3{grid-template-columns:1fr 1fr 1fr;}}
@media(max-width:520px){.footer-grid.footer-grid-3{grid-template-columns:1fr 1fr;}}
.footer-col h4{font-size:11.5px;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:12px;}
.footer-col a{display:block;font-size:13.5px;color:var(--ink);margin-bottom:8px;cursor:pointer;text-decoration:none;}
.footer-col a:hover{text-decoration:underline;}
.footer-bottom{text-align:center;border-top:1px solid var(--border);padding-top:24px;color:var(--ink-faint);font-size:12.5px;}
.footer-bottom .tagline{margin-top:8px;font-family:var(--serif);color:var(--ink-soft);}

/* ---- Motion, depth, and interactive polish ---- */
@keyframes fadeInUp{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes floatBlob{0%,100%{transform:translateY(0) translateX(0) scale(1);}50%{transform:translateY(-22px) translateX(10px) scale(1.06);}}
@keyframes seatPulse{0%,100%{box-shadow:0 0 0 0 rgba(232,178,61,.35);}50%{box-shadow:0 0 0 9px rgba(232,178,61,.14);}}
.app-shell{animation:fadeInUp .5s ease both;}
.marketing-section,.hero-section{animation:fadeInUp .6s ease both;}
.card{animation:fadeInUp .4s ease both;transition:transform .15s,box-shadow .15s;box-shadow:0 2px 4px rgba(20,20,10,.05),var(--shadow);}
.card:hover{transform:translateY(-2px);}
.btn{border-radius:999px;transition:transform .12s,box-shadow .15s;}
.btn-sm{border-radius:999px;}
.btn-primary{box-shadow:0 6px 16px -6px rgba(79,138,74,.45);}
.btn-primary:hover{box-shadow:0 9px 20px -6px rgba(79,138,74,.55);transform:translateY(-1px);}
.btn:active{transform:scale(.96);}
.choice-card{position:relative;transition:transform .12s,background .12s,border-color .12s,color .12s;}
.goal-chip{transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .15s,color .15s;}
.goal-chip:active{transform:scale(.93);}
.goal-chip.selected{transform:scale(1.04);box-shadow:0 3px 10px -3px rgba(0,0,0,.25);}
.sprint-calendar{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
.cal-dow{font-size:11px;color:var(--ink-faint);font-weight:700;text-align:center;padding:2px 0;}
.cal-day{min-height:60px;border-radius:8px;padding:4px;cursor:pointer;display:flex;flex-direction:column;transition:background .15s;}
.cal-day:hover{background:var(--bg-alt);}
.cal-day.in-sprint{background:var(--green-light);}
.cal-day.today{background:var(--green);}
.cal-day.today .cal-day-num{color:#fff;font-weight:800;}
.cal-day-num{font-size:12px;font-weight:600;color:var(--ink-soft);}
.cal-day-pins{display:flex;flex-direction:column;gap:2px;margin-top:2px;}
.cal-pin{font-size:9px;background:var(--card);border-radius:4px;padding:1px 3px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3;}
.cal-day.today .cal-pin{background:rgba(255,255,255,.85);}
.cal-pin-more{font-size:8.5px;color:var(--ink-faint);}
@media(max-width:480px){
  .cal-day{min-height:48px;padding:3px;}
  .cal-day-num{font-size:10.5px;}
  .cal-pin{font-size:8px;}
}
.roadmap-week-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
.roadmap-day-pill{flex:1;min-width:38px;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 2px;border-radius:10px;cursor:pointer;background:var(--bg-alt);transition:background .15s,transform .1s;}
.roadmap-day-pill:active{transform:scale(.95);}
.roadmap-day-pill.today{background:var(--green-light);}
.roadmap-day-pill.selected{background:var(--green);}
.roadmap-day-pill.selected .rdp-dow,.roadmap-day-pill.selected .rdp-num{color:#fff;}
.roadmap-day-pill .rdp-dow{font-size:9.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;}
.roadmap-day-pill .rdp-num{font-size:14px;font-weight:700;color:var(--ink);}
.roadmap-day-pill .rdp-dot{width:5px;height:5px;border-radius:50%;background:var(--green-dark);}
.roadmap-day-pill.selected .rdp-dot{background:#fff;}
.collection-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;}
.tts-btn.speaking{background:var(--green-light);color:var(--green-dark);}
@keyframes treeFlashPop{0%{transform:scale(.7);}40%{transform:scale(1.22);}62%{transform:scale(.94);}80%{transform:scale(1.05);}100%{transform:scale(1);}}
.tree-flash-pop{animation:treeFlashPop 1.3s cubic-bezier(.34,1.4,.4,1) both, treeSway 2.8s ease-in-out 1.3s infinite;}
@keyframes flashBurst{0%{opacity:0;transform:scale(.3);}30%{opacity:.9;transform:scale(1.1);}70%{opacity:.5;transform:scale(1.6);}100%{opacity:0;transform:scale(2.1);}}
.tree-flash-burst{position:absolute;inset:-24px;border-radius:50%;background:radial-gradient(circle,rgba(232,178,61,.6) 0%,rgba(232,178,61,0) 70%);pointer-events:none;animation:flashBurst 1.4s ease-out forwards;z-index:0;}
.flash-banner{position:relative;overflow:hidden;cursor:pointer;background:linear-gradient(135deg,#2C3E50,#34495E);border:none;}
.flash-fog{position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.18),transparent 60%);pointer-events:none;animation:fogDrift 6s ease-in-out infinite;}
@keyframes fogDrift{0%,100%{opacity:.5;}50%{opacity:.9;}}
.flash-fog-full{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 10%,rgba(180,200,220,.28),transparent 55%),radial-gradient(ellipse at 80% 90%,rgba(150,170,200,.2),transparent 55%),rgba(244,241,234,.4);pointer-events:none;z-index:0;}
.flash-timer{font-size:44px;font-weight:800;font-family:'Courier New',monospace;letter-spacing:2px;}
.tree-marker-glint{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none;}
.tree-marker-glint::after{
  content:'';position:absolute;top:-55%;left:-65%;width:38%;height:230%;
  background:linear-gradient(75deg,transparent 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,var(--glint-op,.4)) 50%,rgba(255,255,255,0) 62%,transparent 100%);
  animation:treeMarkerGlintSweep var(--glint-dur,6s) ease-in-out infinite;
}
@keyframes treeMarkerGlintSweep{0%{left:-65%;}18%{left:145%;}100%{left:145%;}}

<body>
<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>
<div class="bg-blob b3"></div>
<div id="app"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="merros-client.js"></script>
<script>
/* ===================== CORE: state, router, toast ===================== */
const state = { screen: 'landing' };
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT=setTimeout(()=>t.classList.remove('show'),1800);
}
/* go() records each screen in browser history, so the phone's back button moves
   back through the app instead of leaving the site. */
function go(screen, opts){
  opts=opts||{};
  if(screen==='lpStreet')screen='lpHouse';
  if(screen==='lpLamp'){lpT.room=lpT.lamp;screen='lpRoom';}
  if(screen==='lpForums')screen='lpFeed';
  if(screen==='lpMirror'||screen==='lpRoomLit')screen='lpHouse';
  if(state.screen===screen && !opts.force){ render(); return; }
  state.screen=screen;
  try{ history[opts.replace?'replaceState':'pushState']({s:screen},'', location.pathname+location.search); }catch(e){}
  window.scrollTo(0,0); render(true);
}
window.addEventListener('popstate',e=>{
  const s=e.state&&e.state.s; if(!s) return;
  state.screen=s; window.scrollTo(0,0); render(true);
});
function renderKeepScroll(){ render(); }
function lmBars(level){
  const w=11,gap=7,H=44,total=4,W=total*w+(total-1)*gap;
  let r='';for(let i=0;i<total;i++){const hh=Math.round(H*(i+1)/total),on=i<level,top=i===level-1;
    r+=`<rect class="lm-bar ${on?'on':''} ${top?'top':''}" style="--i:${i}" x="${i*(w+gap)}" y="${H-hh}" width="${w}" height="${hh}" rx="3"/>`;}
  return `<svg class="lm-bars" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${r}</svg>`;
}
/* ===================== LAMP LANDING (illustration helpers) ===================== */
/* Style tokens: base #0E0E0E, dormant #3D4038, amber #E8A33D, copper/brass detail. */
let _lmUid=0;
const LM={amber:'#EFA21B',amberSoft:'#FFD27A',brass:'#A97C26',copper:'#A8602E',dormant:'#E6D9C0',base:'#B5A483',iron:'#2B3A2E'};

/* Hero: a street receding to a vanishing point, lamps on both kerbs, faint stars. */
function lmHeroSVG(night){
  const W=1200,H=560,vx=600,vy=300,uid=++_lmUid;
  let stars='';
  for(let i=0;i<46;i++){
    const x=(i*167+53)%W, y=(i*83+17)%260, r=(i%5===0)?1.5:0.9;
    stars+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#F3E3C3" class="lm-star" style="animation-delay:-${(i*.37%3).toFixed(2)}s;opacity:${0.35+((i*7)%5)*0.12}"/>`;
  }
  const lampDef=`<g id="hl${uid}">
      <path d="M-3 0 L-2.2 -150 L2.2 -150 L3 0 Z" fill="#2B3A2E"/>
      <rect x="-9" y="-10" width="18" height="10" rx="2" fill="${LM.brass}"/>
      <path d="M-22 -176 L0 -202 L22 -176 Z" fill="${LM.copper}" stroke="${LM.brass}" stroke-width="1.4"/>
      <circle cx="0" cy="-205" r="3" fill="${LM.brass}"/>
    </g>`;
  let skyline='';
  (night?[['#1B2233',.95,22,70,34],['#141A27',1,14,44,26]]:[['#EBCDAE',.85,22,70,34],['#DDB794',.95,14,44,26]]).forEach(([col,op,min,max,wd],layer)=>{
    let x=-20+layer*13;
    while(x<W+40){
      const bw=wd*(0.7+((x*7+layer*3)%10)/12), bh=min+((x*13+layer*29)%(max-min));
      skyline+=`<rect x="${x}" y="${vy-bh}" width="${bw.toFixed(1)}" height="${bh}" fill="${col}" opacity="${op}"/>`;
      if(night&&layer===0)for(let wy=vy-bh+6;wy<vy-6;wy+=9)for(let wx=x+3;wx<x+bw-4;wx+=7)if(((wx*31+wy*17)|0)%5===0)skyline+=`<rect x="${wx.toFixed(1)}" y="${wy}" width="3" height="4" fill="#FFD27A" opacity=".75"/>`;
      x+=bw+2+((x*3)%6);
    }
  });
  let lamps='';
  const steps=[0.07,0.11,0.17,0.26,0.4,0.62,1];
  steps.forEach((s,i)=>{
    const y=vy+(H+40-vy)*s;                       // ground y of this pair
    const half=70+ (W*0.62)*s*0.52;               // kerb offset grows with depth
    const sc=0.12+s*1.15;
    [-1,1].forEach(side=>{
      const x=vx+side*half;
      const headY=y-190*sc;
      const dl=((steps.length-1-i)*0.32).toFixed(2);
      lamps+=`<ellipse cx="${x}" cy="${y}" rx="${150*sc}" ry="${34*sc}" fill="url(#hp${uid})" class="lm-dom" style="animation-delay:${dl}s"/>`;
      lamps+=`<circle cx="${x}" cy="${headY}" r="${120*sc}" fill="url(#hg${uid})" class="lm-dom" style="animation-delay:${dl}s"/>`;
      lamps+=`<path d="M-14 -150 L-18 -176 L18 -176 L14 -150 Z" transform="translate(${x} ${y}) scale(${sc})" fill="#FFC94D" stroke="${LM.brass}" stroke-width="2" class="lm-glass" style="animation-delay:${dl}s"/>`;
      lamps+=`<use href="#hl${uid}" transform="translate(${x} ${y}) scale(${sc})"/>`;
    });
  });
  // slate paving seams across the road
  let seams='';
  [0.1,0.17,0.26,0.4,0.62,0.9].forEach(s=>{
    const y=vy+(H-vy)*s, half=(W*0.5)*s*0.78+30;
    seams+=`<path d="M${vx-half} ${y} L${vx+half} ${y}" stroke="${LM.base}" stroke-opacity=".55" stroke-width="${0.6+s*1.4}"/>`;
  });
  return `<svg class="lm-svg lm-hero-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="A quiet street at golden hour, lined with glowing antique lamps that shrink into the distance" preserveAspectRatio="xMidYMax slice">
    <defs>
      ${night?`<linearGradient id="hs${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000000"/><stop offset=".55" stop-color="#0B1222"/><stop offset="1" stop-color="#1C2540"/></linearGradient>
      <linearGradient id="hr${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2620"/><stop offset="1" stop-color="#16130F"/></linearGradient>
      <radialGradient id="hm${uid}"><stop offset="0" stop-color="#FFF6DD" stop-opacity=".55"/><stop offset="1" stop-color="#FFF6DD" stop-opacity="0"/></radialGradient>`
      :`<linearGradient id="hs${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#FBEBD0"/><stop offset="1" stop-color="#F3C79E"/></linearGradient>
      <linearGradient id="hr${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E0D3BB"/><stop offset="1" stop-color="#C9B999"/></linearGradient>
      <radialGradient id="hm${uid}"><stop offset="0" stop-color="#FFD27A" stop-opacity=".6"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/></radialGradient>`}
      <radialGradient id="hg${uid}"><stop offset="0" stop-color="${LM.amber}" stop-opacity=".62"/><stop offset=".4" stop-color="${LM.amber}" stop-opacity=".2"/><stop offset="1" stop-color="${LM.amber}" stop-opacity="0"/></radialGradient>
      <radialGradient id="hp${uid}"><stop offset="0" stop-color="${LM.amber}" stop-opacity=".6"/><stop offset="1" stop-color="${LM.amber}" stop-opacity="0"/></radialGradient>
      <radialGradient id="hh${uid}" cx=".5" cy="1"><stop offset="0" stop-color="${LM.amber}" stop-opacity=".4"/><stop offset="1" stop-color="${LM.amber}" stop-opacity="0"/></radialGradient>
      ${lampDef}
    </defs>
    <rect width="${W}" height="${H}" fill="url(#hs${uid})"/>
    ${night?`${stars}<circle cx="955" cy="120" r="90" fill="url(#hm${uid})"/><mask id="mk${uid}"><rect width="${W}" height="${H}" fill="#fff"/><circle cx="970" cy="110" r="27" fill="#000"/></mask><circle cx="955" cy="120" r="30" fill="#F6EED8" mask="url(#mk${uid})"/>`
      :`<g class="lm-sun"><circle cx="230" cy="150" r="120" fill="url(#hm${uid})"/><circle cx="230" cy="150" r="38" fill="#FFD27A"/><g stroke="#FFC94D" stroke-width="3" stroke-linecap="round" opacity=".7">${Array.from({length:12},(_,k)=>{const a=k*Math.PI/6;return `<path d="M${(230+Math.cos(a)*50).toFixed(1)} ${(150+Math.sin(a)*50).toFixed(1)} L${(230+Math.cos(a)*64).toFixed(1)} ${(150+Math.sin(a)*64).toFixed(1)}"/>`;}).join('')}</g></g>`}
    <ellipse cx="${vx}" cy="${vy}" rx="460" ry="110" fill="url(#hh${uid})"/>
    ${skyline}
    <rect y="${vy}" width="${W}" height="${H-vy}" fill="${night?'#121019':LM.dormant}"/>
    <path d="M${vx-18} ${vy} L${vx+18} ${vy} L${W+260} ${H} L-260 ${H} Z" fill="url(#hr${uid})"/>
    ${seams}
    ${lamps}
    ${night?Array.from({length:22},(_,k)=>{const x=(k*233+90)%W,y=vy+30+((k*97)%220);return `<circle cx="${x}" cy="${y}" r="${k%3?2:2.8}" fill="#FFE27A" class="lm-ff" style="animation-delay:-${(k*.61%6).toFixed(2)}s;animation-duration:${(5+k%4)}s"/>`;}).join(''):''}
  </svg>`;
}

function lmSprintObserve(){
  const el=document.getElementById('lmSprints'); if(!el) return;
  if(!('IntersectionObserver' in window)){el.classList.add('lm-in');return;}
  const io=new IntersectionObserver(es=>es.forEach(e=>el.classList.toggle('lm-in',e.isIntersecting)),{threshold:.35});
  io.observe(el);
}
function lmAfterRender(){ lmSprintObserve(); }

function lmCtaBlock(note){
  return `<div class="lm-cta">
    <button class="lm-btn" onclick="lpStart()">Start your first sprint</button>
    <p class="lm-cta-sub">${note}</p>
  </div>`;
}
/* One entry point for every "start" button: people already set up go to Today. */
/* A one-way fingerprint of email+password, kept on this device so you can log back in after logging out
   while the account service is offline. The password itself is never stored. */
async function lpPwHash(em,pw){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('merros:'+em.toLowerCase()+':'+pw));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){return null;}}
function lpStart(){ if(LP.user&&LP.onboarded) go('lpDock'); else go('lpGoals'); }

function screenLanding(){
  const sprints=[['Mini sprint','1–2 weeks','lantern','Lantern'],['Standard sprint','3–4 weeks','post','Post lamp'],['Full sprint','5–8 weeks','tall','Tall streetlight'],['Extended sprint','9–12 weeks','double','Double-headed lamp']];
  const steps=[
    ['1','Commit.','Pick what you are finishing and how long you need, from a few days to 12 weeks.'],
    ['2','Show up.','Write one line a day. There are buttons for the days when words don’t come.'],
    ['3','Check in.','A short look back each week. What moved, what stalled.'],
    ['4','Finish.','A new room is added to your house, with a plaque that says what you did.']
  ];
  const diff=[
    ['People, not streaks','Missing a day leaves that day dark. Nothing resets. Your pod sees that you didn’t check in, never why, and never what you wrote.'],
    ['Rotating leadership','In a pod, each person anchors the group for three weeks. Solo, you lead yourself.'],
    ['Likes that mean something','Finished work and shared lessons can be liked, and met with Witness, Celebrate or Support. Followers are called witnesses, and only if you want them.'],
    ['A record you keep','Every finished sprint adds a room to your house, and a line to your Passport. Over time you see everything you’ve done.']
  ];
  const signedIn=LP.user&&LP.onboarded;
  return `
  <div class="lm${LP.theme==='dark'?' lm-dark':''}">${LP_DEFS}
  <header class="lm-hero">
  <div class="container">
    <nav class="lm-nav">
      <div class="lm-brand" onclick="go('landing')">
        <span class="lm-mark"><img src="/merros-mark.png" alt="" /></span>
        <span>Merroes</span>

function lpWupLine(cc){const w=LP_WUP[String(cc||'').toUpperCase()];if(!w)return '';const tot=w[1]+w[2]+w[3],m=n=>n>=1000?(n/1000).toFixed(1)+' million':n+' thousand';

function lpWupMatch(q,have){const n=lpNorm(q);if(n.length<3)return [];const seen=new Set((have||[]).map(c=>lpNorm(c.name)));

async function lpPlaceSearch(q){
  if(q.trim().length>=3){
    try{const ac=new AbortController(),to=setTimeout(()=>ac.abort(),4500);

      if(!r.ok)throw new Error('http '+r.status);const j=await r.json();
      return {live:true,list:(j.results||[]).map(x=>({name:x.name,admin:x.admin1||'',country:x.country||'',cc:x.country_code||'',tz:x.timezone||'',lat:x.latitude,lon:x.longitude}))};

}

function lpStreetSVG(lamps){
  const W=400,H=440,hz=118,n=lamps.length;
  const bend=Math.min(1,n/45)*70;
  const cx=y=>200+bend*Math.pow(1-(y-hz)/(H-hz),2.2)*(-1);
  const hw=y=>5+((y-hz)/(H-hz))*118;
  let left=[],right=[];
  for(let y=hz;y<=H;y+=8){left.push((cx(y)-hw(y)).toFixed(1)+','+y);right.push((cx(y)+hw(y)).toFixed(1)+','+y);}
  const road=left.concat(right.reverse()).join(' ');
  let dash='';for(let y=hz+10;y<H;y+=1){} 
  const mid=[];for(let k=0;k<9;k++){const t0=Math.pow(k/9,1.8),t1=Math.pow((k+.45)/9,1.8);const ya=hz+(H-hz)*t0,yb=hz+(H-hz)*t1;mid.push(`<line x1="${cx(ya).toFixed(1)}" y1="${ya.toFixed(1)}" x2="${cx(yb).toFixed(1)}" y2="${yb.toFixed(1)}" stroke="var(--lp-line)" stroke-width="${(1+t0*3).toFixed(1)}" stroke-linecap="round"/>`);}
  let lampSvg='';
  for(let k=n-1;k>=0;k--){
    const L=lamps[k],z=1.5+k*0.55,u=Math.max(.035,1/z),y=hz+(H-hz-30)*u+8,side=k%2?-1:1;
    const x=cx(y)+side*(hw(y)+34*u+8), h=122*u*1.05, w=h/1.5;
    lampSvg+=`<g class="lp-lampg ${lpT.flash===L.id?'lp-flash':''}" tabindex="0" role="button" aria-label="${lpEsc(L.label)}" onclick="lp.openLamp('${L.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();lp.openLamp('${L.id}')}"><rect x="${(x-w/2-4).toFixed(1)}" y="${(y-h-2).toFixed(1)}" width="${(w+8).toFixed(1)}" height="${(h+4).toFixed(1)}" fill="transparent"/><svg x="${(x-w/2).toFixed(1)}" y="${(y-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" viewBox="0 0 80 120" overflow="visible">${lpLampBody(L.tier,L.st)}</svg><rect class="lp-ring" x="${(x-w/2-6).toFixed(1)}" y="${(y-h-4).toFixed(1)}" width="${(w+12).toFixed(1)}" height="${(h+8).toFixed(1)}" rx="8"/></g>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Your street with ${n} lamps">
    <defs><linearGradient id="lpSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--lp-surface2)"/><stop offset="1" style="stop-color:var(--lp-ground)"/></linearGradient></defs>
    <rect width="${W}" height="${hz}" fill="url(#lpSky)"/><rect y="${hz}" width="${W}" height="${H-hz}" fill="var(--lp-ground)"/>
    <polygon points="${road}" fill="var(--lp-surface2)" stroke="var(--lp-line)" stroke-width="1"/>${mid.join('')}${lampSvg}</svg>`;
}

async function lpFetchStreets(){const c=LP.user&&LP.user.city;if(!c||typeof c.lat!=='number'||(c.streets&&c.streets.length)||(c.streetsAt&&Date.now()-c.streetsAt<6048e5)||lpFetchStreets.busy)return;
  lpFetchStreets.busy=true;c.streetsAt=Date.now();
  try{const q='[out:json][timeout:20];way(around:2500,'+c.lat+','+c.lon+')[highway~"^(trunk|primary|secondary|tertiary|residential)$"][name];out tags 500;';
    const ac=new AbortController(),to=setTimeout(()=>ac.abort(),12000);
    const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q),signal:ac.signal});clearTimeout(to);
    const j=await r.json(),rank={trunk:0,primary:1,secondary:2,tertiary:3,residential:4},best={};
    (j.elements||[]).forEach(e=>{const n=e.tags&&e.tags.name;if(!n)return;const k=rank[e.tags.highway];if(best[n]==null||k<best[n])best[n]=k;});
    const names=Object.keys(best).sort((a,b)=>best[a]-best[b]||a.localeCompare(b)).slice(0,40);
    if(names.length){c.streets=names;lpSave();if(LS.cv)LS.names=lpStreetNames();if(LW.cv)LW.names=lpStreetNames();}}
  catch(e){}

const LPM={};
function lpAdMedia(ad){if(!ad||!ad.id||!(ad.img||ad.vid))return null;let m=LPM[ad.id];
  if(!m){m=LPM[ad.id]={};if(ad.img){m.el=new Image();m.el.src=ad.img;}else if(ad.vid){lpVidGet(ad.id).then(b=>{if(!b)return;const v=document.createElement('video');v.muted=true;v.loop=true;v.playsInline=true;v.autoplay=true;v.src=URL.createObjectURL(b);v.play().catch(()=>{});m.el=v;});}}
  const e=m.el;if(!e)return null;if(e.tagName==='IMG')return e.complete&&e.naturalWidth?e:null;if(e.readyState>=2){if(e.paused)e.play().catch(()=>{});return e;}return null;}
function lpIdb(){return new Promise((ok,no)=>{try{const r=indexedDB.open('merros-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('v');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);}catch(e){no(e);}});}
function lpVidPut(id,blob){return lpIdb().then(db=>new Promise((ok,no)=>{const t=db.transaction('v','readwrite');t.objectStore('v').put(blob,id);t.oncomplete=()=>ok();t.onerror=()=>no(t.error);}));}
function lpVidGet(id){return lpIdb().then(db=>new Promise(ok=>{const q=db.transaction('v').objectStore('v').get(id);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null);})).catch(()=>null);}
function lpVidDel(id){return lpIdb().then(db=>{db.transaction('v','readwrite').objectStore('v').delete(id);}).catch(()=>{});}

function lpAdPanel(c,ad,x,y,w,h,flip){c.save();c.translate(x+w/2,y+h/2);if(flip==='m')c.scale(-1,1);else if(flip==='r')c.rotate(Math.PI);
  const X=-w/2,Y=-h/2;c.fillStyle=ad.c||'#4F8A4A';c.beginPath();c.roundRect?c.roundRect(X,Y,w,h,Math.min(4,h/6)):c.rect(X,Y,w,h);c.fill();

  const big=h>=22&&ad.s,hs=Math.max(6,Math.min(30,h*(big?.34:.46)));c.fillStyle='#fff';c.textAlign='left';c.textBaseline='middle';
  const fit=(t,wt,sz,maxw)=>{let q=String(t||''),z=sz;c.font=wt+' '+z+'px system-ui,sans-serif';while(z>sz*.62&&c.measureText(q).width>maxw){z-=.5;c.font=wt+' '+z+'px system-ui,sans-serif';}while(q.length>3&&c.measureText(q).width>maxw)q=q.slice(0,-2);return q===String(t||'')?q:q.replace(/\s+$/,'')+'…';};
  c.fillText(fit(ad.h,'700',hs,tw),tx,big?Y+h*.36:0);
  if(big){c.globalAlpha=.92;c.fillText(fit(ad.s,'500',Math.max(5,hs*.6),tw),tx,Y+h*.72);c.globalAlpha=1;}

  c.fillStyle='rgba(0,0,0,.4)';c.fillRect(X+w-tgw-1,Y+1,tgw,ts*1.5);c.fillStyle='#fff';c.textAlign='center';c.fillText(tg,X+w-tgw/2-1,Y+1+ts*.78);
  c.textBaseline='alphabetic';c.restore();}

function lpMeMeta(){return {from:LP.visit!=null&&LP.user&&LP.user.city?LP.user.city.name:'',name:lpName(),status:lpStatus(),bio:((LP.user&&LP.user.bio)||'').slice(0,160),sk:(LP.user&&LP.user.sigil&&LP.user.sigil.k)||null,x:Math.round(LW.p.x),y:Math.round(LW.p.y)};}
function lpPresenceStart(){
  if(!LP.user||LP.demo)return;const room=lpCitySlug();if(!room)return;
  if(LPP.ch&&LPP.room===room)return;lpPresenceStop();
  const cl=lpPresenceClient();if(!cl){LPP.state='unavailable';lwCount();return;}
  LPP.id=LPP.id||('p'+Math.random().toString(36).slice(2,10));LPP.room=room;LPP.others={};LPP.state='connecting';
  try{
    const ch=cl.channel('town:'+room,{config:{presence:{key:LPP.id},broadcast:{self:false}}});LPP.ch=ch;
    ch.on('presence',{event:'sync'},()=>{const st=ch.presenceState(),seen={};
      Object.keys(st).forEach(k=>{if(k===LPP.id)return;const m=st[k][st[k].length-1];if(!m||lpIsBlocked(m.name))return;seen[k]=1;const o=LPP.others[k];
        if(o){o.name=m.name;o.status=m.status||'';o.sk=m.sk;o.from=String(m.from||'').slice(0,30);o.bio=String(m.bio||'').slice(0,160);}else LPP.others[k]={id:k,name:String(m.name||'?').slice(0,12),status:String(m.status||'').slice(0,60),bio:String(m.bio||'').slice(0,160),sk:m.sk,x:m.x||1200,y:m.y||1200,tx:m.x||1200,ty:m.y||1200,face:1,step:0,mv:0};});
      Object.keys(LPP.others).forEach(k=>{if(!seen[k])delete LPP.others[k];});lwCount();});
    ch.on('broadcast',{event:'pos'},({payload:q})=>{const o=q&&LPP.others[q.id];if(!o)return;o.tx=+q.x||o.tx;o.ty=+q.y||o.ty;if(q.status!=null)o.status=String(q.status).slice(0,60);});
    ch.subscribe(st=>{if(st==='SUBSCRIBED'){LPP.state='live';if(LP.prefs.presence===true)ch.track(lpMeMeta());}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){LPP.state='unavailable';}lwCount();});
  }catch(e){LPP.state='unavailable';lwCount();}
}

function lpPresenceTick(dt){if(!LPP.ch||LPP.state!=='live'||LP.prefs.presence!==true)return;const now=performance.now();
  const moved=Math.abs(LW.p.x-LPP.lastX)+Math.abs(LW.p.y-LPP.lastY)>3;
  if(moved&&now-LPP.lastSend>220||now-LPP.lastSend>5000){LPP.lastSend=now;LPP.lastX=LW.p.x;LPP.lastY=LW.p.y;try{LPP.ch.send({type:'broadcast',event:'pos',payload:{id:LPP.id,x:Math.round(LW.p.x),y:Math.round(LW.p.y),status:lpStatus()}});}catch(e){}}
  Object.values(LPP.others).forEach(o=>{const dx=o.tx-o.x,dy=o.ty-o.y,d=Math.hypot(dx,dy);if(d>400){o.x=o.tx;o.y=o.ty;o.mv=0;return;}if(d>1.5){const k=Math.min(1,dt*6);o.x+=dx*k;o.y+=dy*k;o.mv=1;o.step+=dt*10;if(Math.abs(dx)>.5)o.face=dx<0?-1:1;}else o.mv=0;});}

const LP_FAQ=[
['How do I start a sprint?','From Today, tap Start a sprint when none is running. Pick an area, say what you’ll finish and what “done” looks like, choose hours, days or weeks, choose solo or a pod, then begin. Day one is today.'],
['Why a torch for hours?','A sprint measured in hours gets a burning torch instead of a lantern. Days and weeks get lanterns that grow with the length.'],
['How does pod matching work?','Choose “with a pod”, add your age band and, if you want, your gender. Then say who you would like in your pod: ages close to yours or any, anyone or only women or only men, same goal area, similar time zone. Matching needs real accounts, which are not live in this preview, so your request is saved and shown as “Looking for your pod”.'],
['What are witnesses?','Witnesses are Merroes’s version of followers. Turn them on in Me or Settings and people can witness you: they see when you start and finish a sprint, nothing else. Tap someone’s name to witness them, if they have turned it on.'],
['How do shifts work?','Go into a café or another place in the city and start a shift: 25 or 50 minutes of focused work on your own goal. Your avatar shows you’re on shift. Finish it and you earn 1 log per 25 minutes, up to 4 a day. Leave early and it doesn’t count.'],
['What is Give back?','Real volunteering in your city. Log what you did with a charity or community group (hours, place, photo), join or organise actions, or list your own organisation and recruit volunteers. Organisations show “Not verified” until Merroes checks their registration. Merroes never takes donations; it links to the organisation’s own page.'],
['Who else is in my city?','Everyone who chose the same city and has the City screen open right now. You see their avatar walking, with their status written under it. Tap someone to see their status and bio. Turn off “Show me walking in my city” in Settings to stay hidden.'],
['What is my status?','A short line under your avatar in the city, like what you are working on today. Set it from the city or from Me.'],
['What is the dark room?','A one-minute break. Lamplighter: keep a row of lamps lit while distractions try to pull your light away. Questions: general knowledge. Once today’s line is in, playing can earn one birch log a day.'],
['Why only some cities?','The city is shared with people in the same city, so we open a short list of cities at launch and draw each one in its region’s style. More cities open as people join.'],
['Can I advertise in the forums?','Yes, if the ad fits the board. Open a board and tap Advertise to this board. Every ad is marked AD, and off-topic ads are taken down.'],
['What counts as showing up?','Writing your line, or tapping one of the buttons: made progress, kept going, or got stuck. Each of those lights the day. “Didn’t get to it” is saved too, and that day stays dark.'],
['What happens if I miss a day?','That day stays dark. Nothing resets and nothing is taken away. If you’re in a pod, they see that you didn’t check in that day, not why. Nobody outside your pod is told. You can log yesterday late, take a planned rest day, and a sprint with dark days still counts as finished.'],
['Can I change my sprint length?','No. The length is fixed once you begin, which keeps the finish line real. When it ends you can start a new one of any length.'],
['How do pods work?','A pod is up to four people on a sprint at the same time. You see who showed up each day, not what they wrote. One person anchors for three weeks, then it rotates. In this preview, invites don’t link accounts yet, so a pod only shows on your own device.'],
['Who can see what I write?','Only you, unless you turn on “Show my daily lines to my pod” in Settings. Your lines can’t be searched and are never used to choose ads.'],
['Where is my data kept?','In this browser, on this device. Clearing your browser data or switching device starts fresh. Use Export everything in Settings to keep a copy.'],
['What are logs?','Logs are earned by showing up and finishing sprints, plus one a day from the dark room once your line is in. You spend them in the city. They can’t be bought, sent to anyone, or cashed out.'],
['Are there ads?','Businesses will be able to advertise on billboards, buses and shop signs in the city. Every ad is marked AD, and Today never shows ads. Advertising isn’t open yet.'],
['How do I delete my data?','Me, then Settings, then Delete my account. That clears everything on this device.']];

function lpPrivacyBody(){return lpLegal('Privacy',[
 ['The short version','Almost everything you do in Merroes stays on your device. We don’t sell data, there are no advertising or analytics trackers on this site, and your daily lines are never used to choose ads.'],
 ['What stays on your device','Your callsign, sprints, daily lines, check-ins, pod, posts, threads, logs and settings are saved in this browser’s storage on this device. They aren’t sent to us. So you can log back in after logging out, a one-way fingerprint of your email and password is kept here too. The password itself is never stored.'],

 ['Pod matching details','If you ask to be matched into a pod, your age band, your gender if you give it, and your pod preferences (age, gender, goal area, time zone) are saved on this device. Gender is optional. Once matching is live they will be used only to find your pod, and other people will see your age band, not your exact age.'],

  try{const ac=new AbortController(),to=setTimeout(()=>ac.abort(),5000);const r=await fetch('https://opentdb.com/api.php?amount=20&type=multiple&encode=url3986',{signal:ac.signal});clearTimeout(to);
    const j=await r.json();if(j.response_code===0&&j.results){const dec=s=>decodeURIComponent(s);j.results.forEach(x=>LG_Q.queue.push({q:dec(x.question),ok:dec(x.correct_answer),bad:x.incorrect_answers.map(dec),live:true}));}}catch(e){}
  LG_Q.busy=false;}
function lgNextQ(){if(LG_Q.queue.length<3)lgFetchQs();
  if(LG_Q.queue.length)return LG_Q.queue.shift();

  update(){
    const W=LG.W,H=LG.H,m=LG.mouse;

    if(this.x-this.size<0||this.x+this.size>W)this.vx*=-1;
    if(this.y-this.size<0||this.y+this.size>H)this.vy*=-1;
    this.x=Math.max(this.size,Math.min(W-this.size,this.x));this.y=Math.max(this.size,Math.min(H-this.size,this.y));
    const sp=Math.hypot(this.vx,this.vy); if(sp>5){this.vx*=5/sp;this.vy*=5/sp;}

  }
}

/* ---------- MONEY ----------
   Logs are earned only and can't be bought. Money buys ads and leases on places in the city.
   Prices are set per market in local currency (not converted live), paid through Paystack.
   These are starting prices to test, not market research. */
const LP_CUR={NG:['NGN','₦',0],GH:['GHS','GH₵',1],KE:['KES','KSh',2],ZA:['ZAR','R',3]};
const LP_PRICE={/* per day for ads, per month for leases: [NGN, GHS, KES, ZAR, USD] */
  pole:[1500,20,200,25,1.5],shelter:[2500,35,350,45,2.5],forum:[2000,25,250,35,2],taxi:[3000,40,400,55,3],billboard:[5000,70,650,90,5],truck:[6000,80,800,110,6],bus:[7500,100,1000,135,7.5],digital:[8000,110,1100,145,8],
  cafe:[10000,140,1300,180,10],greenhouse:[12000,165,1600,215,12],gallery:[12000,165,1600,215,12],observatory:[15000,200,2000,270,15],restaurant:[15000,200,2000,270,15],hotel:[20000,270,2600,360,20]};
function lpCur(){const cc=((LP.user&&LP.user.city&&LP.user.city.cc)||'').toUpperCase();return LP_CUR[cc]?{code:LP_CUR[cc][0],sym:LP_CUR[cc][1],i:LP_CUR[cc][2]}:{code:'USD',sym:'$',i:4};}
function lpPrice(k,n){const c=lpCur(),v=(LP_PRICE[k]||[0,0,0,0,0])[c.i]*(n||1);return {v,code:c.code,txt:c.sym+(c.code==='USD'?v.toFixed(v%1?2:0):Math.round(v).toLocaleString())};}
/* Ads are priced per 1,000 views (CPM), not per day.
   Base CPMs in naira sit in the Lagos digital out-of-home range (roughly ₦3,000–6,000 per 1,000 for standard placements).
   Reaching a chosen age range costs more: these multipliers are starting hypotheses to test with advertisers, not market data.
   Age targeting only reaches people who switched on "Use my age range to choose ads" (off by default). */
const LP_CPM={pole:3000,shelter:3500,forum:4000,taxi:4000,billboard:4500,truck:5000,bus:5500,digital:6000};
const LP_AGE_X={'18–24':1.0,'25–34':1.4,'35–44':1.6,'45–54':1.5,'55+':1.2};
const LP_AGE_FEE=1.15; /* targeting premium on top of the band multiplier */
const LP_FX=[1,0.014,0.13,0.018,0.001]; /* NGN to [NGN,GHS,KES,ZAR,USD], rounded, for display only */
const LP_AD_BUDGETS=[25000,50000,100000,250000]; /* naira; ₦25,000 is the minimum campaign */
function lpMoney(ngn){const c=lpCur(),v=ngn*LP_FX[c.i],r=c.code==='USD'?Math.round(v*100)/100:c.code==='NGN'?Math.round(v/100)*100:Math.round(v);return {v:r,code:c.code,txt:c.sym+(c.code==='USD'?r.toFixed(r%1?2:0):r.toLocaleString())};}
function lpAdCpm(f){const ages=f.ages||[],x=ages.length?Math.max(...ages.map(a=>LP_AGE_X[a]||1))*LP_AGE_FEE:1;return Math.round((LP_CPM[f.slot]||4500)*x);}
function lpAdQuote(f){const b=f.budget||LP_AD_BUDGETS[0],cpm=lpAdCpm(f);return Object.assign(lpMoney(b),{cpm,cpmTxt:lpMoney(cpm).txt,views:Math.floor(b/cpm*1000)});}

    <div class="lp-ix">${LP_IX.map(g=>`<h2>${g[0]}</h2><ol>${g[1].map(x=>{n++;return `<li><button onclick="lp.reviewOpen('${x[0]}','${x[2]||''}')"><b>${n}</b>${x[1]}${x[2]==='out'?'<span>logged out</span>':''}</button></li>`;}).join('')}</ol>`).join('')}</div>
    <p class="lp-small" style="margin:20px 0 10px">${n} screens. Some only appear at certain moments for a real person, for example Sprint complete at the end of a sprint.</p>`,null);}
Object.assign(LP_SCREENS,{lpIndex:lpIndexScreen});Screens.lpIndex=lpIndexScreen;
Object.assign(lp,{
  reviewIndex(){if(lpT.review){LP=JSON.parse(lpT.review);lpSave();}go('lpIndex');},
  reviewOpen(k,setup){if(lpT.review)LP=JSON.parse(lpT.review);
    const today=lpToday();
    if(setup==='out'||setup==='confirm'||setup==='finding'){LP.draft=Object.assign(lpBlank().draft||{},LP.draft||{},{goals:['Finish the first draft of chapter one'],done:['it’s 3,000 words and I’ve sent it to someone'],unit:'weeks',len:6,weeks:6});LP.mode='alongside';}
    if(setup==='out'){LP.user=null;}
    if(setup==='finding'){LP.pod=null;LP.podPrefs=Object.assign(lpPodPrefsDefault(),{age:'25–34',gender:'Woman',wantGender:'women'});LP.podReq=Object.assign({},LP.podPrefs,{ts:Date.now()});}
    if(setup==='nopod'){LP.pod=null;LP.podReq=null;}
    if(setup==='after'&&LP.sprint){LP.sprint.lines[today]={kind:'progress',text:'Drafted the opening scene.',ts:Date.now()};}
    if(setup==='lamp'){lpT.lamp=LP.finished[LP.finished.length-1].id;}
    if(setup==='room'){const f=LP.finished[LP.finished.length-1];lpT.room=f?f.id:'hall';}
    if(setup==='hall'){lpT.room='hall';}
    if(setup==='opp'){lpT.opp='o3';}
    if(setup==='trip'){lpT.tripTo=1;LP.visas={};}
    if(setup==='ride'){LP.trip={to:1,mode:'plane',mins:50,start:Date.now()-12*60000,task:'Write 10,000 words',cracks:0,from:'Lagos'};}
    if(setup==='cof'){lpT.opp='o6';}
    if(setup==='focus'){LP.focus={start:Date.now()-6*60000,mins:25,task:'Write 10,000 words',cracks:1};}
    if(setup==='board'){lpT.board=LP_BOARDS[0][0];}
    if(setup==='thread'){const t=lpFThreads()[0];lpT.thread2=t.id;lpT.board=t.board;}
    if(k==='lpChat')lpT.thread='pod';
    lpSave();state.screen='';go(k,{force:true});}
});
/* Start: ?demo=1 loads the sample street for reviewing screens. Otherwise a signed-up
   person lands on Today, everyone else on the landing page. */
(function boot(){
  if(LP_REVIEW||/[?&]demo=1\b/.test(location.search)) lpSeedDemo();
  if(LP_REVIEW){ lpT.review=JSON.stringify(LP); }
  state.screen = LP_REVIEW ? 'lpIndex' : (LP.user && LP.onboarded) ? 'lpDock' : 'landing';
  try{ history.replaceState({s:state.screen},'',location.pathname+location.search); }catch(e){}
  render(true);
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/service-worker.js').catch(e=>console.error('SW registration failed', e));
  });
}
</script>
