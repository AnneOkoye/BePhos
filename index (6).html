<style>
:root{
  --bg:#FFFFFF; --bg-alt:#F4F6F2; --card:#FFFFFF;
  --ink:#1E2A1E; --ink-soft:#6B7A66; --ink-faint:#9AA894;
  --green:#4F8A4A; --green-dark:#3D6E3A; --green-light:#E3F1DE;
  --terracotta:#D98B4A; --terracotta-light:#FBE8D5;
  --rose:#E893A0; --rose-light:#FCE6EA;
  --gold:#E8B23D; --gold-light:#FCEFCF;
  --border:#E5E9DE; --radius:18px;
  --shadow:0 1px 2px rgba(20,20,10,.05), 0 10px 26px -14px rgba(20,20,10,.18);
  --serif:'Bricolage Grotesque',Figtree,system-ui,sans-serif; --sans:'Inter',sans-serif;
  --shell-w:620px;
}
@media(min-width:768px){ :root{ --shell-w:760px; } }
@media(min-width:1080px){ :root{ --shell-w:960px; } }
@media(min-width:1440px){ :root{ --shell-w:1180px; } }
@media(min-width:1800px){ :root{ --shell-w:1320px; } }

*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;letter-spacing:0em;margin:0;}
p{margin:0;line-height:1.55;}
a{color:inherit;}
.container{max-width:1120px;margin:0 auto;padding:0 28px;}
@media(min-width:1440px){ .container{max-width:1320px;} }
@media(min-width:1800px){ .container{max-width:1540px;} }
@media(min-width:2200px){ .container{max-width:1760px;} }
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.card + .card{margin-top:14px;}
.section{margin-top:28px;}
.muted{color:var(--ink-soft);}
.faint{color:var(--ink-faint);font-size:12.5px;}
.small{font-size:13px;}
.center{text-align:center;}
.row{display:flex;align-items:center;}
.row.between{justify-content:space-between;}
.row.gap{gap:10px;}
.row.wrap{flex-wrap:wrap;}
.stack{display:flex;flex-direction:column;}
hr.rule{border:none;border-top:1px solid var(--border);margin:14px 0;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:10px;
  font-weight:600;font-size:14.5px;cursor:pointer;border:1px solid transparent;transition:.15s;font-family:var(--sans);}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:8px;}
.btn-ghost{background:transparent;color:var(--green);border:none;padding:6px 8px;font-weight:700;}
.btn-ghost:hover{text-decoration:underline;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
button{font-family:var(--sans);}

input,textarea,select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
  background:#fff;font-family:var(--sans);font-size:14.5px;color:var(--ink);}
input:focus,textarea:focus,select:focus{outline:2px solid var(--green);outline-offset:1px;}
textarea{resize:vertical;min-height:70px;}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;}

.dots{display:flex;align-items:center;gap:0;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex:none;position:relative;transition:background .3s;}
.dot.on{background:var(--green);}
.dot:not(:last-child)::after{content:'';display:block;position:absolute;left:100%;top:50%;transform:translateY(-50%);width:14px;height:2px;background:var(--border);transition:background .3s;}
.dot.on:not(:last-child)::after{background:var(--green);}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:6px;}
.grid{display:grid;gap:12px;}
.pill{padding:8px 14px;border-radius:999px;border:1.5px solid var(--border);font-size:13.5px;font-weight:600;cursor:pointer;background:#fff;color:var(--ink-soft);}
.pill.active{background:var(--green);border-color:var(--green);color:#fff;}

.switch{width:42px;height:24px;border-radius:999px;background:var(--border);position:relative;cursor:pointer;flex:none;transition:.15s;}
.switch.on{background:var(--green);}

.msg{padding:10px 0;border-bottom:1px solid var(--border);}
.msg:last-child{border-bottom:none;}
.msg .who{font-weight:700;font-size:13px;}
.msg .when{color:var(--ink-faint);font-size:11.5px;font-weight:500;}

#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:var(--shadow);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
.hero-text{flex:1.05;}

nav.top{padding:20px 0;}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-weight:700;font-size:19px;cursor:pointer;}
.brand .mark{width:26px;height:26px;color:var(--green);}

/* ---- Motion, depth, and interactive polish ---- */
@keyframes fadeInUp{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes floatBlob{0%,100%{transform:translateY(0) translateX(0) scale(1);}50%{transform:translateY(-22px) translateX(10px) scale(1.06);}}

.card{animation:fadeInUp .4s ease both;transition:transform .15s,box-shadow .15s;box-shadow:0 2px 4px rgba(20,20,10,.05),var(--shadow);}
.card:hover{transform:translateY(-2px);}
.btn{border-radius:999px;transition:transform .12s,box-shadow .15s;}
.btn-sm{border-radius:999px;}
.btn:active{transform:scale(.96);}





.bg-blob{position:fixed;border-radius:50%;filter:blur(50px);opacity:.32;z-index:-1;pointer-events:none;animation:floatBlob 10s ease-in-out infinite;}
.bg-blob.b1{width:260px;height:260px;background:var(--green-light);top:-70px;left:-70px;}
.bg-blob.b2{width:220px;height:220px;background:var(--gold-light);bottom:14%;right:-70px;animation-delay:2.4s;}
.bg-blob.b3{width:200px;height:200px;background:var(--rose-light);bottom:-90px;left:22%;animation-delay:4.8s;}
/* ---- Lamp landing (scoped to .lm; the rest of the app keeps its light theme) ---- */
body.lm-dark{background:#FFFFFF;}
.lm.lm-dark{--lp-ink:#F2F2F2;--lp-surface:#0C0C0C;--lp-dormant:#333333;--lp-iron:#9A9A9A;--lm-bg:#000000;--lm-bg2:#0C0C0C;--lm-card:#0C0C0C;--lm-line:#2A2A2A;--lm-ink:#F2F2F2;--lm-soft:#A0A0A0;--lm-faint:#6E6E6E;--lm-accent:#E8A33D;--lm-accent-dk:#F6C877;--lm-accent-lt:#2A2010;background:#000;color:#F2F2F2;}
.lm.lm-dark .lm-btn:not(.lm-btn-ghost){color:#000;}
.lm.lm-dark .lm-hero-art::after{background:linear-gradient(to bottom,rgba(0,0,0,0) 0%,rgba(0,0,0,.6) 45%,#000 100%);}
.lm-star{animation:lmTw 3.2s ease-in-out infinite alternate;}
@keyframes lmTw{from{opacity:.15}to{opacity:.9}}
.lm-ff{animation:lmFF 6s ease-in-out infinite;filter:drop-shadow(0 0 4px #FFD27A);}
@keyframes lmFF{0%{transform:translate(0,0);opacity:0}20%{opacity:.95}50%{transform:translate(18px,-22px);opacity:.4}80%{opacity:.9}100%{transform:translate(-10px,-40px);opacity:0}}
.lm-sun{transform-origin:230px 150px;animation:lmSun 40s linear infinite;}
@keyframes lmSun{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.lm-star,.lm-ff,.lm-sun{animation:none!important}}
body.lm-body-dark{background:#000;}
.lm-alpha{margin-left:8px;padding:2px 8px;border-radius:99px;border:1px solid var(--lm-line);font:700 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--lm-soft);vertical-align:middle;}
.lm-theme{min-width:44px;padding-left:0!important;padding-right:0!important;font-size:17px;}
.lm{--lp-lit:#EFA21B;--lp-lit2:#FFD27A;--lp-litline:#A97C26;--lp-iron:#2B3A2E;--lp-dormant:#E3E3DF;--lp-ink:#0F1710;--lp-surface:#FFFFFF;--lp-glow:rgba(239,162,27,.5);--lm-bg:#FFFFFF;--lm-bg2:#F6F6F4;--lm-card:#FFFFFF;--lm-line:#E7E7E4;--lm-ink:#1E2A1E;--lm-soft:#6B7A66;--lm-faint:#9AA894;--lm-accent:#F9A42B;--lm-accent-dk:#B35A0F;--lm-accent-lt:#FFF1DA;--lm-onyx:#0E0E0E;
  background:var(--lm-bg);color:var(--lm-ink);font-family:var(--sans);min-height:100vh;overflow-x:hidden;}
.lm h1,.lm h2,.lm h3,.lm h4{font-family:var(--serif);color:var(--lm-ink);}
.lm p{line-height:1.6;}
.lm-nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0;}
.lm-brand{display:flex;align-items:center;gap:10px;cursor:pointer;font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:.01em;}
.lm-mark{display:inline-flex;align-items:center;}
.lm-mark img{height:27px;width:auto;object-fit:contain;}
.lm-navbtns{display:flex;gap:10px;}
.lm-navbtns .lm-btn{white-space:nowrap;}
@media (max-width:400px){.lm-navbtns{gap:6px;}.lm-navbtns .lm-btn-sm{padding:9px 12px;}.lm-nav .lm-alpha{display:none;}}
.lm-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 30px;border-radius:999px;border:1px solid var(--lm-accent);background:var(--lm-accent);color:#fff;font:700 15px var(--sans);cursor:pointer;box-shadow:0 8px 22px -10px rgba(249,164,43,.5);transition:transform .12s,box-shadow .15s,background .15s;}
.lm-btn:hover{background:var(--lm-accent-dk);transform:translateY(-1px);}
.lm-btn:active{transform:scale(.97);}
.lm-btn:focus-visible,.lm input:focus-visible{outline:2px solid var(--lm-accent);outline-offset:3px;}
.lm-btn-sm{padding:9px 16px;font-size:13px;box-shadow:none;}
.lm-btn-ghost{background:transparent;color:var(--lm-accent-dk);box-shadow:none;}
.lm-btn-ghost:hover{background:var(--lm-accent-lt);}
.lm-hero{--art-h:clamp(300px,46vw,940px);position:relative;overflow:hidden;text-align:center;background:var(--lm-bg);padding-bottom:calc(var(--art-h) * .6);}
.lm-hero .container{position:relative;z-index:3;}
.lm-hero-text{position:relative;z-index:3;padding-top:22px;}
.lm-hero .container{position:relative;z-index:3;}
.lm-hero h1{font-size:clamp(32px,5.6vw,58px);line-height:1.12;max-width:860px;margin:0 auto 22px;text-wrap:balance;}
.lm-body{max-width:620px;margin:0 auto;color:var(--lm-soft);font-size:16px;}
.lm-cta{max-width:420px;margin:34px auto 0;text-align:center;}
.lm-cta .lm-btn{width:100%;}
.lm-cta-sub{margin-top:12px;font-size:13px;color:var(--lm-faint);}
.lm-hero-art{position:absolute;left:0;right:0;bottom:0;height:var(--art-h);z-index:1;}
/* The street fades into the next section instead of ending on a hard edge. */
.lm-hero-art::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:42%;background:linear-gradient(to bottom,rgba(246,246,244,0) 0%,rgba(246,246,244,.55) 45%,var(--lm-bg2) 100%);pointer-events:none;}
.lm-hero + .lm-sec{border-top:0;}
.lm-svg{display:block;width:100%;height:auto;overflow:visible;}
.lm-hero-svg{height:100%;}
.lm-hero-art .lm-hero-svg{width:100%;height:100%;}
.lm-sec{padding:76px 0;border-top:1px solid var(--lm-line);}
.lm-alt{background:var(--lm-bg2);}
.lm-title{font-size:clamp(28px,3.6vw,38px);text-align:center;margin-bottom:12px;text-wrap:balance;}
.lm-sub{text-align:center;color:var(--lm-soft);font-size:16px;max-width:600px;margin:0 auto 28px;text-wrap:pretty;}
.lm-closing{text-align:center;color:var(--lm-soft);max-width:560px;margin:34px auto 0;font-family:var(--serif);font-size:19px;font-style:italic;text-wrap:balance;}
.lm-grid{display:grid;gap:18px;max-width:1080px;margin:0 auto;}
.lm-g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.lm-g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.lm-wide{max-width:920px;}
@media(max-width:900px){.lm-g4{grid-template-columns:repeat(2,minmax(0,1fr));}.lm-g3{grid-template-columns:minmax(0,1fr);}}
@media(max-width:620px){.lm-g4{grid-template-columns:minmax(0,1fr);}.lm-sec{padding:56px 0;}}
.lm-card{background:var(--lm-card);border:1px solid var(--lm-line);border-radius:16px;padding:26px 22px;}
.lm-card h3{font-size:20px;margin-bottom:8px;}
.lm-card p{color:var(--lm-soft);font-size:14.5px;}
.lm-card p + p{margin-top:10px;}
.lm-step{text-align:left;}
.lm-eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--lm-accent-dk);}
.lm-sprint{text-align:center;}
.lm-faint{color:var(--lm-faint);font-size:13px;}
.lm-sprint .lm-faint{margin-top:4px;}
.lm-stage{transition:opacity .4s;}
.lm-in .lm-stage{animation:lmStage 4.8s ease-in-out infinite;}


@keyframes lmStage{0%,18%{opacity:.25}34%,82%{opacity:1}96%,100%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.lm-in .lm-stage{animation:none !important;}}

.lm-final{text-align:center;}
.lm-footer{padding:56px 0 30px;border-top:1px solid var(--lm-line);}
/* Palette (Oct 2026): amber = light and your own progress, teal = people. One neutral family. Green retired.
   Amber and cyan are fills with dark text; on light backgrounds text uses the deep shades (4.8:1 and 5.6:1). */
.lm{--lm-accent:#F9A42B;--lm-accent-hv:#F7922A;--lm-accent-ink:#0F1710;--lm-accent-dk:#B35A0F;--lm-accent-lt:#FFF1DA;--lm-teal:#51D2E5;--lm-teal-hv:#3CC2D6;--lm-teal-dk:#0B7285;
  --lm-ink:#13201F;--lm-soft:#5E6B6E;--lm-faint:#8E9A9C;--lm-line:#E4E9EA;--lm-bg2:#F5F8F8;--lm-veil2:rgba(245,248,248,.88);}
.lm.lm-dark{--lm-accent:#F9A42B;--lm-accent-dk:#F9A42B;--lm-accent-lt:#2A2010;--lm-teal-dk:#51D2E5;--lm-soft:#A3ADAE;--lm-faint:#6F7A7B;}
.lm .lm-btn{background:var(--lm-accent);border-color:var(--lm-accent);color:var(--lm-accent-ink);box-shadow:0 8px 22px -10px rgba(249,164,43,.55);}
.lm .lm-btn:hover{background:var(--lm-accent-hv);border-color:var(--lm-accent-hv);}
.lm .lm-btn-ghost{background:transparent;color:var(--lm-accent-dk);box-shadow:none;}
.lm .lm-btn-ghost:hover{background:var(--lm-accent-lt);}
.lm .lm-btn-t{background:var(--lm-teal);border-color:var(--lm-teal);box-shadow:0 8px 22px -10px rgba(81,210,229,.55);}
.lm .lm-btn-t:hover{background:var(--lm-teal-hv);border-color:var(--lm-teal-hv);}
.lm .lm-btn:focus-visible{outline-color:var(--lm-accent-dk);}
.lm-hero h1{font-size:clamp(30px,5vw,52px);line-height:1.12;margin-bottom:16px;}
.lm-word{display:block;width:min(560px,86%);height:auto;margin:6px auto 10px;overflow:visible;}
.lm-word text{font:600 132px var(--serif);letter-spacing:-.01em;}
.lm-word-fill{fill:var(--lm-ink);}

.lm-t{color:var(--lm-teal-dk);}
.lm-center{text-align:center;margin-bottom:10px;}
.lm-ways{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:620px;margin:30px auto 0;text-align:left;}
.lm-way{display:flex;flex-direction:column;gap:4px;min-width:0;padding:18px 22px;border-radius:16px;text-decoration:none;color:var(--lm-accent-ink);transition:transform .12s,box-shadow .15s;}
.lm-way b{font:600 24px/1.1 var(--serif);}
.lm-way span{font-size:14px;opacity:.85;}
.lm-way:hover{transform:translateY(-2px);}
.lm-way:focus-visible{outline:2px solid var(--lm-ink);outline-offset:3px;}
.lm-way-t{background:var(--lm-teal);box-shadow:0 12px 30px -14px rgba(81,210,229,.8);}
.lm-way-g{background:var(--lm-accent);box-shadow:0 12px 30px -14px rgba(249,164,43,.8);}
.lm-hero .lm-cta-sub{margin-top:14px;}
@media(max-width:520px){.lm-ways{grid-template-columns:minmax(0,1fr);}}
.lm.lm-3d-on .lm-ways,.lm.lm-3d-on .lm-hero .lm-btn{text-shadow:none;}
.lm.lm-3d-on .lm-hero .lm-body,.lm.lm-3d-on .lm-hero .lm-cta-sub{color:var(--lm-ink);}
@media(max-width:620px){#lmSprints{grid-template-columns:repeat(2,minmax(0,1fr));}#lmSprints .lm-card{padding:18px 12px;}}
/* 3D street behind the whole landing page. Added only once WebGL is running; until then the SVG street shows. */
.lm-3d{position:fixed;inset:0;z-index:0;pointer-events:none;}
.lm-3d canvas{display:block;width:100%;height:100%;}
.lm{--lm-veil:rgba(255,255,255,.82);--lm-veil2:rgba(246,246,244,.88);}
.lm.lm-dark{--lm-veil:rgba(0,0,0,.70);--lm-veil2:rgba(12,12,12,.78);}
.lm.lm-3d-on{background:transparent;}
.lm.lm-3d-on > header,.lm.lm-3d-on > section,.lm.lm-3d-on > footer{position:relative;z-index:1;}
.lm.lm-3d-on .lm-hero{background:transparent;}
.lm.lm-3d-on .lm-hero-text{text-shadow:0 0 18px rgba(255,255,255,.9),0 0 3px rgba(255,255,255,.8);}
.lm.lm-dark.lm-3d-on .lm-hero-text{text-shadow:0 1px 16px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.8);}
.lm.lm-3d-on .lm-hero-art{display:none;}
.lm.lm-3d-on .lm-sec{background:var(--lm-veil);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
.lm.lm-3d-on .lm-alt{background:var(--lm-veil2);}
.lm.lm-3d-on .lm-final{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border-top:0;padding:120px 0 calc(var(--art-h,40vw) * .5);}
.lm.lm-3d-on .lm-footer{background:var(--lm-veil2);}
.lm-foot-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;max-width:760px;margin:0 auto 30px;}
@media(max-width:560px){.lm-foot-grid{grid-template-columns:minmax(0,1fr);}}
.lm-foot-grid.lm-foot-2{grid-template-columns:repeat(2,minmax(0,1fr));max-width:520px;}
.lm-foot-grid h4{font:700 11.5px var(--sans);letter-spacing:.1em;color:var(--lm-faint);margin-bottom:12px;}
.lm-foot-grid a{display:block;font-size:14px;color:var(--lm-ink);margin-bottom:8px;cursor:pointer;text-decoration:none;}
.lm-foot-grid a:hover{color:var(--lm-accent);}
.lm-foot-bottom{text-align:center;border-top:1px solid var(--lm-line);padding-top:24px;color:var(--lm-faint);font-size:12.5px;}
.lm-foot-bottom div{margin-top:8px;font-family:var(--serif);font-size:14px;color:var(--lm-soft);}

/* domino glow: each lamp lights in turn, delays are set per lamp */
@keyframes lmDom{0%{opacity:.08}7%{opacity:1}62%{opacity:1}80%{opacity:.08}100%{opacity:.08}}
@keyframes lmGlass{0%{fill:#ECE6D2}7%{fill:#FFC94D}62%{fill:#FFC94D}80%{fill:#ECE6D2}100%{fill:#ECE6D2}}
.lm-dom{animation:lmDom 6s ease-in-out infinite;}
.lm-glass{animation:lmGlass 6s ease-in-out infinite;}

/* ---- Lamp app (screens 2-45), scoped to .lp ---- */

<body>
<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>
<div class="bg-blob b3"></div>
<div id="app"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script>
<script src="merros-client.js"></script>
<script>
/* ===================== CORE: state, router, toast ===================== */
const state = { screen: 'landing' };
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT=setTimeout(()=>t.classList.remove('show'),1800);
}
/* ---------- The group word. Small groups were "pods"; the app now calls them a Space by default, and a group
   (or, later, the organisation running it) can choose its own word: Squad, Circle, Study group, anything.
   The source keeps "pod" as the internal name; every piece of text on screen passes through lpWordify, applied by
   one observer, so a new word reaches menus, sheets, toasts and the tab bar without touching each string.
   People's own messages (.lp-msg) and anything marked data-raw are left exactly as written. ---------- */

function lpWord(){try{const w=(typeof LP!=='undefined'&&LP&&LP.word||'').trim();return w||'Space';}catch(e){return 'Space';}}
function lpPlural(w){if(/(s|sh|ch|x|z)$/i.test(w))return w+'es';if(/[^aeiou]y$/i.test(w))return w.slice(0,-1)+'ies';return w+'s';}
function lpWordForm(orig){const W=lpWord(),pl=/s$/i.test(orig),base=pl?lpPlural(W):W;
  if(orig===orig.toUpperCase())return base.toUpperCase();
  if(orig[0]===orig[0].toUpperCase())return base[0].toUpperCase()+base.slice(1);
  return W==='Space'?base:base.toLowerCase();}
function lpWordify(t){if(!t||!/pod/i.test(t))return t;
  return String(t).replace(/\b([Aa])n? (pods?)\b/g,(m,a,pw)=>{const f=lpWordForm(pw);return (/^[aeiou]/i.test(f)?a+'n':a)+' '+f;})
    .replace(/\b(pods?|Pods?|PODS?)\b/g,m=>lpWordForm(m));}
const lpWordDone=new WeakMap();
function lpWordNode(n){
  if(n.nodeType===3){const el=n.parentElement;if(!el||el.closest('.lp-msg,.lp-quote,[data-raw],script,style,textarea'))return;
    if(lpWordDone.get(n)===n.data)return;const v=lpWordify(n.data);if(v!==n.data)n.data=v;lpWordDone.set(n,n.data);return;}
  if(n.nodeType!==1||n.closest('.lp-msg,.lp-quote,[data-raw],script,style'))return;
  const els=[n].concat(Array.from(n.querySelectorAll('[aria-label],[placeholder],[title],[alt]')));
  els.forEach(e=>['aria-label','placeholder','title','alt'].forEach(a=>{const v=e.getAttribute(a);if(v&&/pod/i.test(v)){const w=lpWordify(v);if(w!==v)e.setAttribute(a,w);}}));
  const tw=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let x;while((x=tw.nextNode()))lpWordNode(x);}
function lpWordStart(){if(window.__lpWordObs)return;lpWordNode(document.body);
  const o=new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')lpWordNode(m.target);else if(m.type==='attributes')lpWordNode(m.target);else m.addedNodes.forEach(lpWordNode);}});
  o.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['aria-label','placeholder','title']});window.__lpWordObs=o;}
/* go() records each screen in browser history, so the phone's back button moves
   back through the app instead of leaving the site. */
function go(screen, opts){
  opts=opts||{};
  if(screen==='lpStreet'||screen==='lpHouse'||screen==='lpRoom')screen='lpLedger';
  if(screen==='lpLamp'){lpT.homeSel=lpT.lamp;screen='lpLedger';}
  if(screen==='lpForums')screen='lpFeed';
  if(screen==='lpMirror'||screen==='lpRoomLit')screen='lpLedger';
  screen=rRoute(screen);
  if(state.screen===screen && !opts.force){ render(); return; }
  state.screen=screen;
  try{ history[opts.replace?'replaceState':'pushState']({s:screen},'', location.pathname+location.search); }catch(e){}
  window.scrollTo(0,0); render(true);
}
window.addEventListener('popstate',e=>{
  const s=e.state&&e.state.s; if(!s) return;
  state.screen=s; window.scrollTo(0,0); render(true);
});


/* ===================== LAMP LANDING (illustration helpers) ===================== */
/* Style tokens: base #0E0E0E, dormant #3D4038, amber #E8A33D, copper/brass detail. */
let _lmUid=0;
const LM={amber:'#EFA21B',amberSoft:'#FFD27A',brass:'#A97C26',copper:'#A8602E',dormant:'#E6D9C0',base:'#B5A483',iron:'#2B3A2E'};

/* Hero: a street receding to a vanishing point, lamps on both kerbs, faint stars. */
function lmHeroSVG(night){
  const W=1200,H=560,vx=600,vy=300,uid=++_lmUid;
  let stars='';
  for(let i=0;i<46;i++){
    const x=(i*167+53)%W, y=(i*83+17)%260, r=(i%5===0)?1.5:0.9;
    stars+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#F3E3C3" class="lm-star" style="animation-delay:-${(i*.37%3).toFixed(2)}s;opacity:${0.35+((i*7)%5)*0.12}"/>`;
  }
  const lampDef=`<g id="hl${uid}">
      <path d="M-3 0 L-2.2 -150 L2.2 -150 L3 0 Z" fill="#2B3A2E"/>
      <rect x="-9" y="-10" width="18" height="10" rx="2" fill="${LM.brass}"/>
      <path d="M-22 -176 L0 -202 L22 -176 Z" fill="${LM.copper}" stroke="${LM.brass}" stroke-width="1.4"/>
      <circle cx="0" cy="-205" r="3" fill="${LM.brass}"/>
    </g>`;
  let skyline='';
  (night?[['#1B2233',.95,22,70,34],['#141A27',1,14,44,26]]:[['#EBCDAE',.85,22,70,34],['#DDB794',.95,14,44,26]]).forEach(([col,op,min,max,wd],layer)=>{
    let x=-20+layer*13;
    while(x<W+40){
      const bw=wd*(0.7+((x*7+layer*3)%10)/12), bh=min+((x*13+layer*29)%(max-min));
      skyline+=`<rect x="${x}" y="${vy-bh}" width="${bw.toFixed(1)}" height="${bh}" fill="${col}" opacity="${op}"/>`;
      if(night&&layer===0)for(let wy=vy-bh+6;wy<vy-6;wy+=9)for(let wx=x+3;wx<x+bw-4;wx+=7)if(((wx*31+wy*17)|0)%5===0)skyline+=`<rect x="${wx.toFixed(1)}" y="${wy}" width="3" height="4" fill="#FFD27A" opacity=".75"/>`;
      x+=bw+2+((x*3)%6);
    }
  });
  let lamps='';
  const steps=[0.07,0.11,0.17,0.26,0.4,0.62,1];
  steps.forEach((s,i)=>{
    const y=vy+(H+40-vy)*s;                       // ground y of this pair
    const half=70+ (W*0.62)*s*0.52;               // kerb offset grows with depth
    const sc=0.12+s*1.15;
    [-1,1].forEach(side=>{
      const x=vx+side*half;
      const headY=y-190*sc;
      const dl=((steps.length-1-i)*0.32).toFixed(2);
      lamps+=`<ellipse cx="${x}" cy="${y}" rx="${150*sc}" ry="${34*sc}" fill="url(#hp${uid})" class="lm-dom" style="animation-delay:${dl}s"/>`;
      lamps+=`<circle cx="${x}" cy="${headY}" r="${120*sc}" fill="url(#hg${uid})" class="lm-dom" style="animation-delay:${dl}s"/>`;
      lamps+=`<path d="M-14 -150 L-18 -176 L18 -176 L14 -150 Z" transform="translate(${x} ${y}) scale(${sc})" fill="#FFC94D" stroke="${LM.brass}" stroke-width="2" class="lm-glass" style="animation-delay:${dl}s"/>`;
      lamps+=`<use href="#hl${uid}" transform="translate(${x} ${y}) scale(${sc})"/>`;
    });
  });
  // slate paving seams across the road
  let seams='';
  [0.1,0.17,0.26,0.4,0.62,0.9].forEach(s=>{
    const y=vy+(H-vy)*s, half=(W*0.5)*s*0.78+30;
    seams+=`<path d="M${vx-half} ${y} L${vx+half} ${y}" stroke="${LM.base}" stroke-opacity=".55" stroke-width="${0.6+s*1.4}"/>`;
  });
  return `<svg class="lm-svg lm-hero-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="A quiet street at golden hour, lined with glowing antique lamps that shrink into the distance" preserveAspectRatio="xMidYMax slice">
    <defs>
      ${night?`<linearGradient id="hs${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000000"/><stop offset=".55" stop-color="#0B1222"/><stop offset="1" stop-color="#1C2540"/></linearGradient>
      <linearGradient id="hr${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2620"/><stop offset="1" stop-color="#16130F"/></linearGradient>
      <radialGradient id="hm${uid}"><stop offset="0" stop-color="#FFF6DD" stop-opacity=".55"/><stop offset="1" stop-color="#FFF6DD" stop-opacity="0"/></radialGradient>`
      :`<linearGradient id="hs${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#FBEBD0"/><stop offset="1" stop-color="#F3C79E"/></linearGradient>
      <linearGradient id="hr${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E0D3BB"/><stop offset="1" stop-color="#C9B999"/></linearGradient>
      <radialGradient id="hm${uid}"><stop offset="0" stop-color="#FFD27A" stop-opacity=".6"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/></radialGradient>`}
      <radialGradient id="hg${uid}"><stop offset="0" stop-color="${LM.amber}" stop-opacity=".62"/><stop offset=".4" stop-color="${LM.amber}" stop-opacity=".2"/><stop offset="1" stop-color="${LM.amber}" stop-opacity="0"/></radialGradient>
      <radialGradient id="hp${uid}"><stop offset="0" stop-color="${LM.amber}" stop-opacity=".6"/><stop offset="1" stop-color="${LM.amber}" stop-opacity="0"/></radialGradient>
      <radialGradient id="hh${uid}" cx=".5" cy="1"><stop offset="0" stop-color="${LM.amber}" stop-opacity=".4"/><stop offset="1" stop-color="${LM.amber}" stop-opacity="0"/></radialGradient>
      ${lampDef}
    </defs>
    <rect width="${W}" height="${H}" fill="url(#hs${uid})"/>
    ${night?`${stars}<circle cx="955" cy="120" r="90" fill="url(#hm${uid})"/><mask id="mk${uid}"><rect width="${W}" height="${H}" fill="#fff"/><circle cx="970" cy="110" r="27" fill="#000"/></mask><circle cx="955" cy="120" r="30" fill="#F6EED8" mask="url(#mk${uid})"/>`
      :`<g class="lm-sun"><circle cx="230" cy="150" r="120" fill="url(#hm${uid})"/><circle cx="230" cy="150" r="38" fill="#FFD27A"/><g stroke="#FFC94D" stroke-width="3" stroke-linecap="round" opacity=".7">${Array.from({length:12},(_,k)=>{const a=k*Math.PI/6;return `<path d="M${(230+Math.cos(a)*50).toFixed(1)} ${(150+Math.sin(a)*50).toFixed(1)} L${(230+Math.cos(a)*64).toFixed(1)} ${(150+Math.sin(a)*64).toFixed(1)}"/>`;}).join('')}</g></g>`}
    <ellipse cx="${vx}" cy="${vy}" rx="460" ry="110" fill="url(#hh${uid})"/>
    ${skyline}
    <rect y="${vy}" width="${W}" height="${H-vy}" fill="${night?'#121019':LM.dormant}"/>
    <path d="M${vx-18} ${vy} L${vx+18} ${vy} L${W+260} ${H} L-260 ${H} Z" fill="url(#hr${uid})"/>
    ${seams}

function lm3dTick(now){
  LM3D.raf=0;
  const r=LM3D.r; if(!r||!document.body.contains(r.domElement)) return;   // landing closed: stop
  const max=Math.max(1,document.documentElement.scrollHeight-innerHeight),p=Math.min(1,Math.max(0,scrollY/max));

  LM3D.z+=(zT-LM3D.z)*(LM3D.still?1:.07);
  const t=now/1000,cam=LM3D.cam,sway=LM3D.still?0:1;
  cam.position.set(Math.sin(t*.25)*.18*sway,1.55+Math.sin(t*.4)*.04*sway,LM3D.z);
  cam.lookAt(0,1.95,LM3D.z-26);
  LM3D.skyG.position.copy(cam.position);
  const dim=new THREE.Color(LM3D.P.dormant),lit=new THREE.Color(LM3D.P.lit),gw=LM3D.P.glow;
  LM3D.lamps.forEach(l=>{
    const target=l.z>LM3D.z-24?1:0;                 // lights as you come within reach, stays lit behind you
    l.lit+=(target-l.lit)*(LM3D.still?1:.05);
    const f=LM3D.still?1:.93+.07*Math.sin(t*7+l.ph)*Math.sin(t*3.1+l.ph);
    l.glass.color.copy(dim).lerp(lit,l.lit);
    l.sprites.forEach(s=>s.material.opacity=l.lit*gw*f);
    l.pool.material.opacity=l.lit*gw*.55*f;
  });
  if(LM3D.ff&&!LM3D.still){const a=LM3D.ff.pts.geometry.attributes.position,b=LM3D.ff.base;
    for(let i=0;i<a.count;i++){a.array[i*3]=b[i*3]+Math.sin(t*.6+i)*.6;a.array[i*3+1]=b[i*3+1]+Math.sin(t*.9+i*1.7)*.35;a.array[i*3+2]=b[i*3+2]+Math.cos(t*.5+i)*.6;}
    a.needsUpdate=true;}
  r.render(LM3D.scene,cam);
  LM3D.raf=requestAnimationFrame(lm3dTick);
}

   Pick a block (25, 50 or 90 minutes). The torch burns while you work. If you leave the app,
   it flickers; when you come back you say honestly whether you were working. "I got distracted"
   cracks the torch. Three cracks and it goes out, and the block doesn't count. Finished blocks add

const LF={raf:0,cv:null,ctx:null,parts:[],t:0,last:0};

/* ---------- Torch colours (chosen by each person) and heat (how long you've stayed with it).
   Heat steps are reached at a share of the session length T, if you don't look away:

   A distraction drops one step; you climb again from the start of that step. ---------- */

function lpInfo(){

function lpAuthMsg(e,mode){const m=((e&&e.message)||'').toLowerCase();
  if(m.includes('invalid login credentials'))return 'That email and password don’t match an account. Check them, or reset your password below.';
  if(m.includes('email not confirmed'))return 'Confirm your email first. Open the link we sent when you signed up, then log in here.';
  if(m.includes('already registered')||m.includes('already been registered'))return 'There’s already an account with this email. Log in instead.';
  if(m.includes('not authorized')||m.includes('rate limit')||m.includes('error sending'))return 'We couldn’t send the email just now. Please try again in an hour, or let us know through Help.';
  if(m.includes('did not load')||m.includes('didn’t load')||m.includes('failed to fetch')||m.includes('network'))return 'We couldn’t reach the account service. Check your connection and try again.';
  if(m.includes('did not answer')||m.includes('didn’t answer'))return 'The account service is slow to answer. Try again in a moment.';
  return (e&&e.message)||'Please try again.';}

const R_STATUS={completed:['Completed','The step, or close to it'],partial:['Partly done','Started, not finished'],blocked:['Blocked','Something is in the way'],rescheduled:['Rescheduled','Moving it to another time']};
const R_REASONS=[['no_time','No time'],['too_big','The step was too big'],['unclear_start','Didn’t know where to start'],['unwell','Tired or unwell'],['other_priority','Something else came first'],['rather_not_say','Rather not say']];
const R_CHOICES=[['resume','Carry on as planned','Same step, same plan'],['reduce','Make the step smaller','Shrink it to something you can do in one sitting'],['reschedule','Move the time','Pick days and a time that fit this week'],['ask_help','Mark a blocker and ask for help','Note what’s in the way and bring it to your next session'],['pause','Pause this goal','Come back to it when you’re ready. Nothing is lost.'],['rethink','Rethink the goal','Change the finish line or the date, or end it']];
const R_PRESETS=[[15,'Quick start'],[25,'Focus'],[50,'Deep work'],[90,'Extended'],[120,'Long session']];
const R_DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function rId(){try{return crypto.randomUUID();}catch(e){return 'x'+Date.now().toString(16)+Math.random().toString(16).slice(2,10);}}
function rToday(){return lpKey(new Date());}
function rD(){LP.r=LP.r||{};const r=LP.r;['goals','plans','checkins','recoveries','reviews','history','blocked'].forEach(k=>{if(!Array.isArray(r[k]))r[k]=[];});r.presence=r.presence||{state:'quiet',until:0,who:'groups'};return r;}
function rGoal(id){return rD().goals.find(g=>g.id===id);}
function rPlan(gid){return rD().plans.find(p=>p.goal_id===gid&&p.is_current);}
function rActive(){return rD().goals.filter(g=>g.status==='active');}
function rCheck(gid,day){return rD().checkins.find(c=>c.goal_id===gid&&c.day===day);}
function rArea(k){return R_AREAS.find(a=>a[0]===k);}
function rIcon(k,size){const a=rArea(k);if(!a)return '';return `<svg class="rx-ic" width="${size||26}" height="${size||26}" viewBox="0 0 24 24" fill="none" stroke="${a[3]}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${a[4]}</svg>`;}
function rWeekDays(){const d=new Date();const mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));return Array.from({length:7},(_,i)=>{const x=new Date(mon);x.setDate(mon.getDate()+i);return {key:lpKey(x),dow:x.getDay()};});}
/* Planned days in the last week with no check-in and no recovery choice made since. */
function rMissed(g){const p=rPlan(g.id);if(!p||!p.days||!p.days.length)return [];const out=[],t=rToday(),made=(g.created_at||'').slice(0,10);
  for(let i=1;i<=7;i++){const d=new Date();d.setDate(d.getDate()-i);const k=lpKey(d);if(k<made)break;if(p.days.includes(d.getDay())&&!rCheck(g.id,k))out.push(k);}
  const lastRec=rD().recoveries.filter(r=>r.goal_id===g.id).map(r=>r.created_at.slice(0,10)).sort().pop()||'';
  return out.filter(k=>k>lastRec&&k<t);}
function rPlanSentence(p){if(!p)return '';const bits=[];if(p.cue_time)bits.push('at '+rTime(p.cue_time));if(p.cue_place)bits.push('at '+lpEsc(p.cue_place));
  let s=(bits.length?'When it’s '+bits.join(' ')+', ':'')+'I’ll '+lpEsc(p.next_action.charAt(0).toLowerCase()+p.next_action.slice(1))+(p.minutes?' for '+p.minutes+' minutes':'')+'.';
  if(p.obstacle_if&&p.obstacle_then)s+=' If '+lpEsc(p.obstacle_if)+', I’ll '+lpEsc(p.obstacle_then)+'.';return s;}
function rTime(t){if(!t)return '';const [h,m]=t.split(':').map(Number);const am=h<12;const hh=((h+11)%12)+1;return hh+(m?':'+String(m).padStart(2,'0'):'')+(am?' am':' pm');}
function rFmtDay(k){const d=lpParse(k);return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});}
function rClock(ms){return new Date(ms).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});}

/* ---------- sync with the pilot backend, once it exists ---------- */
const RS={checked:false,on:false};
function rSb(){return window.Merros&&Merros.sb&&LP.user&&LP.user.synced?Merros.sb:null;}
async function rRemote(){const sb=rSb();if(!sb)return false;if(RS.checked)return RS.on;RS.checked=true;
  try{const {error}=await sb.from('goals').select('id').limit(1);RS.on=!error;if(RS.on){const u=await sb.auth.getUser();RS.uid=u&&u.data&&u.data.user?u.data.user.id:null;}}catch(e){RS.on=false;}return RS.on;}
async function rPush(table,row,opts){try{if(!(await rRemote()))return;const {error}=await rSb().from(table).upsert(row,opts||{});if(error)console.warn('BePhos sync',table,error.message);}catch(e){}}
async function rPull(){try{if(!(await rRemote()))return;const sb=rSb(),r=rD();
  const [g,p,c]=await Promise.all([sb.from('goals').select('*'),sb.from('goal_plans').select('*'),sb.from('goal_checkins').select('*')]);
  const merge=(arr,rows)=>{(rows||[]).forEach(x=>{const i=arr.findIndex(y=>y.id===x.id);if(i>=0)arr[i]=Object.assign(arr[i],x);else arr.push(x);});};
  if(!g.error)merge(r.goals,g.data);if(!p.error)merge(r.plans,p.data);if(!c.error)merge(r.checkins,c.data);lpSave();if(state.screen.startsWith('r'))render();}catch(e){}}
function rGoalRow(g){return {id:g.id,area:g.area,outcome:g.outcome,done_when:g.done_when||null,deadline:g.deadline||null,status:g.status};}
function rPlanRow(p){return {id:p.id,goal_id:p.goal_id,next_action:p.next_action,cue_time:p.cue_time||null,cue_place:p.cue_place||null,minutes:p.minutes||null,obstacle_if:p.obstacle_if||null,obstacle_then:p.obstacle_then||null,days:p.days||[],is_current:p.is_current};}

const RSS={list:null,loading:false,roster:[],rosterAt:0};
async function rLoadSessions(){if(RSS.loading)return;RSS.loading=true;try{if(await rRemote()){const {data,error}=await rSb().from('sessions').select('*').gt('ends_at',new Date().toISOString()).eq('status','scheduled').order('starts_at').limit(20);RSS.list=error?[]:data;if(!error&&data.length){const c=await rSb().rpc('session_rsvp_counts');if(!c.error&&c.data){RSS.rsvp={};c.data.forEach(x=>{RSS.rsvp[x.session_id]={coming:x.coming,me:x.me};});}}}else RSS.list=[];}catch(e){RSS.list=[];}RSS.loading=false;if(['rExplore','rTogether','rHome'].includes(state.screen))render();}
/* The pilot's one dependable weekly slot: Tuesdays 7 pm West Africa Time (18:00 UTC), 50 minutes, quiet. */
function rPilotSlot(){const now=new Date();const d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate(),18,0,0));let add=(2-d.getUTCDay()+7)%7;d.setUTCDate(d.getUTCDate()+add);if(d.getTime()+50*6e4<now.getTime())d.setUTCDate(d.getUTCDate()+7);
  return {id:'pilot-weekly',title:'Application sprint',purpose:'application_sprint',format:'quiet',starts_at:d.toISOString(),duration_min:50,extended_min:0,capacity:12,pilot:true};}

const R_TABS=[['rGoals','My Goals','<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>'],['rTogether','Together','<circle cx="9" cy="8.5" r="3"/><circle cx="16.5" cy="9.5" r="2.4"/><path d="M3.5 19c.4-3.4 2.7-5.5 5.5-5.5s5.1 2.1 5.5 5.5M14 14.3c2.6-.4 5.3 1.2 6 4.7"/>'],['rCommons','Commons','<path d="M4 6.5h16M4 12h10M4 17.5h13"/><circle cx="18.5" cy="12" r="1.6" fill="currentColor"/>'],['rProfile','Me','<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.6-4 3.4-6.5 7-6.5s6.4 2.5 7 6.5"/>']];
function rShell(inner,o){o=o||{};const tab=o.tab,signed=!!(LP.user);
  const top=o.back?`<div class="rx-top"><button class="rx-back" onclick="${o.back[1]}">← ${o.back[0]}</button>${o.step?`<span class="rx-step">${o.step}</span>`:''}</div>${o.dots?`<div class="rx-dots" aria-hidden="true">${o.dots}</div>`:''}`
    :`<div class="rx-top"><button class="rx-logo" onclick="go('${signed?'rHome':'landing'}')">BePhos</button>${signed?'':`<button class="rx-btn rx-sm rx-ghost" onclick="go('lpLogin')">Log in</button>`}</div>`;
  const tabs=signed&&o.tabs!==false?`<nav class="rx-tabs" aria-label="Main">${R_TABS.map(t=>`<button class="rx-tab${tab===t[0]?' on':''}" ${tab===t[0]?'aria-current="page"':''} onclick="go('${t[0]}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${t[2]}</svg>${t[1]}</button>`).join('')}</nav>`:'';
  return `<div class="rx${LP.theme==='light'?' rx-light':''}"><div class="rx-wrap${tabs?' rx-hastabs':''}">${top}<main class="rx-body">${inner}</main></div>${tabs}</div>`;}
const rDots=(n,of)=>Array.from({length:of},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('');

/* ---------- HOME ---------- */
function rHome(){const r=rD(),act=rActive(),t=rToday();
  const away=rAwayDays(),due=rDeadlineDue(),missedG=away?null:act.find(g=>rMissed(g).length);
  const slot=rPilotSlot(),joinedNext=r.history.find(h=>h.session_id&&!h.left_at);
  let body='';
  if(away&&act.length){body+=`<div class="rx-card rx-hl"><p class="rx-eye">Welcome back</p><b>It’s been ${away} days. There’s nothing to catch up on.</b><span class="rx-muted">Missed days stay as they were. Start from today.</span>
      <div class="rx-row rx-wrapr"><button class="rx-btn" onclick="rx.welcome('resume')">Pick up my next step</button><button class="rx-btn rx-ghost" onclick="rx.welcome('smaller')">Make it smaller</button></div><button class="rx-link" onclick="rx.welcome('new')">Start something different</button></div>`;}
  if(due&&!away){body+=`<div class="rx-card rx-attn"><p class="rx-eye rx-o">Deadline was ${lpEsc(rFmtDay(due.deadline).split(',')[0])}</p><b>How did “${lpEsc(due.outcome)}” go?</b>
      <div class="rx-row rx-wrapr"><button class="rx-btn" onclick="rx.deadline('done')">I finished it</button><button class="rx-btn rx-ghost" onclick="rx.deadline('going')">Still working on it</button></div><button class="rx-link" onclick="rx.deadline('retire')">Let it go</button></div>`;}
  if(missedG){const m=rMissed(missedG);body+=`<button class="rx-card rx-attn rx-click" onclick="lpT.rg='${missedG.id}';lpT.rrec={};go('rRecovery',{force:true})"><p class="rx-eye rx-o">${m.length>1?m.length+' planned days':'Your plan for '+rFmtDay(m[0]).split(',')[0]}</p><b>${m.length>1?'The last few plans didn’t happen.':'That plan didn’t happen.'} What got in the way?</b><span class="rx-muted">No judgement. It helps pick a better next step.</span></button>`;}
  if(act.length){const g=act[0],p=rPlan(g.id),c=rCheck(g.id,t);
    body+=`<div class="rx-head"><p class="rx-eye">Your goal${act.length>1?' · 1 of '+act.length:''}</p><h1>${lpEsc(g.outcome)}</h1></div>
    <div class="rx-card rx-hl"><p class="rx-eye">Next step</p><b class="rx-big">${lpEsc(p?p.next_action:'Choose your next step')}</b>${p?`<span class="rx-muted">${rPlanSentence(p)}</span>`:''}
      ${c?`<span class="rx-done">Checked in today: ${R_STATUS[c.status][0].toLowerCase()}</span><button class="rx-btn rx-ghost" onclick="lpT.rg='${g.id}';go('rCheckin',{force:true})">Change today’s check-in</button>`:`<button class="rx-btn" onclick="lpT.rg='${g.id}';go('rCheckin',{force:true})">Check in for today</button>`}
      ${p?'':`<button class="rx-btn rx-ghost" onclick="lpT.rg='${g.id}';go('rPlanEdit',{force:true})">Add a plan</button>`}</div>
    ${rWeekCard(g)}`;}
  else body+=`<div class="rx-head"><h1>What would be useful now?</h1><p class="rx-sub">Work toward something, or do something alongside other people. Both count.</p></div>
    <button class="rx-way rx-way-a" onclick="rx.newGoal()">${'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>'}<b>Start a goal</b><span>Pick something to work toward and the next step. About a minute.</span></button>`;
  body+=`<button class="rx-way rx-way-b" onclick="go('rExplore')"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3"/><circle cx="16.5" cy="9.5" r="2.4"/><path d="M3.5 19c.4-3.4 2.7-5.5 5.5-5.5s5.1 2.1 5.5 5.5M14 14.3c2.6-.4 5.3 1.2 6 4.7"/></svg><b>${act.length?'Work alongside others':'Join a session'}</b><span>${lpEsc(slot.title)}, ${new Date(slot.starts_at).toLocaleDateString([], {weekday:'long'})} ${rClock(slot.starts_at)} · ${slot.duration_min} min · quiet</span></button>`;
  if(!r.history.length&&LP.user)body+=`<div class="rx-card"><p class="rx-eye">Your first session</p><b>${lpEsc(slot.title)} · ${new Date(slot.starts_at).toLocaleDateString([], {weekday:'long'})} ${rClock(slot.starts_at)}</b>${rAttend(slot)}</div>`;
  if(r.room&&r.room.ends>Date.now())body+=`<button class="rx-card rx-click" onclick="go('rRoom')"><p class="rx-eye">Happening now</p><b>You’re in ${lpEsc(r.room.title)}</b><span class="rx-muted">Ends at ${rClock(r.room.ends)}</span></button>`;
  body+=`<p class="rx-muted rx-c" style="margin-top:auto">Your goals and notes are private unless you choose to share them.</p>`;
  return rShell(body);}
function rWeekCard(g){const p=rPlan(g.id),t=rToday(),ig=lpT.rIgnite&&lpT.rIgnite.g===g.id?lpT.rIgnite.day:null;
  const map={completed:'on',partial:'half',rescheduled:'moved',blocked:'blocked'};
  const cells=rWeekDays().map(d=>{const c=rCheck(g.id,d.key),planned=p&&p.days&&p.days.includes(d.dow);
    const cls=c?map[c.status]:(d.key<t&&planned?'dark':(planned?'planned':'rest'));
    const label=c?R_STATUS[c.status][0]:(d.key<t&&planned?'No check-in':(planned?'Planned':'Not planned'));
    return `<div class="rx-lamp rx-l-${cls}${d.key===t?' today':''}${ig===d.key&&(cls==='on'||cls==='half')?' rx-ignite':''}" title="${label}"><div class="rx-post"><div class="rx-pool"></div><div class="rx-pole"></div><div class="rx-bloom"></div><div class="rx-cap"></div><div class="rx-glass"></div></div><span>${d.key===t?'Today':R_DAYS[d.dow]}</span><em class="rx-sr">${label}</em></div>`;}).join('');
  return `<div class="rx-card"><p class="rx-eye">This week</p><div class="rx-lamps">${cells}</div><p class="rx-muted">Each check-in lights that day’s lamp. Partly done glows low. Moved or blocked days keep their lamp, unlit. A planned day with no check-in is just dark glass. Nothing breaks.</p></div>`;}
/* One light per week of the goal: lit if you completed or partly did a step that week. */
function rGoalPath(g){const r=rD(),DAY=864e5,wk=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x.getTime();};
  const start=wk(g.created_at||Date.now()),now=wk(Date.now()),end=g.deadline?Math.max(wk(g.deadline+'T12:00:00'),now):now+3*7*DAY;
  let weeks=[];for(let w=start;w<=end;w+=7*DAY)weeks.push(w);if(weeks.length<2)weeks.push(start+7*DAY);
  const cur=Math.max(0,weeks.indexOf(now));let off=0;if(weeks.length>14)off=Math.min(Math.max(0,cur-9),weeks.length-14);const vis=weeks.slice(off,off+14);
  const cs=r.checkins.filter(c=>c.goal_id===g.id);
  const st=w=>{const k=cs.filter(c=>{const t=new Date(c.day+'T12:00:00').getTime();return t>=w&&t<w+7*DAY;});return k.some(c=>c.status==='completed'||c.status==='partial')?'lit':(k.length?'touched':'');};
  const W=320,H=84,n=vis.length,pts=vis.map((w,i)=>[12+(W-24)*i/(n-1),56-18*Math.sin(i/(n-1)*Math.PI*1.1)-i*(10/n)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const lit=weeks.filter(w=>st(w)==='lit').length,ci=weeks.indexOf(now)-off;
  const dots=pts.map((p,i)=>{const s2=st(vis[i]),last=off+i===weeks.length-1,isNow=i===ci,rad=last?7:5;
    return (s2==='lit'?`<circle cx="${p[0]}" cy="${p[1]}" r="14" fill="url(#rxPG)"/>`:'')+`<circle class="rx-pd ${s2}${isNow?' now':''}" cx="${p[0]}" cy="${p[1]}" r="${rad}"/>`;}).join('');
  const lab=(i,t,dy)=>`<text x="${Math.min(W-6,Math.max(6,pts[i][0]))}" y="${pts[i][1]+(dy||20)}" text-anchor="${i===0?'start':(i===n-1?'end':'middle')}">${t}</text>`;
  return `<div class="rx-card"><p class="rx-eye">${g.deadline?'Week '+(weeks.indexOf(now)+1)+' of '+weeks.length:'Week '+(weeks.indexOf(now)+1)}</p><div class="rx-path"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${lit} of ${weeks.length} weeks lit"><defs><radialGradient id="rxPG"><stop offset="0" style="stop-color:rgb(var(--warm));stop-opacity:.55"/><stop offset="1" style="stop-color:rgb(var(--warm));stop-opacity:0"/></radialGradient></defs>
    <path d="${d}" fill="none" stroke="currentColor" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="2 4"/>${dots}${off===0?lab(0,'Start'):''}${ci>0&&ci<n-1?lab(ci,'Now',-12):''}${off+n===weeks.length?lab(n-1,g.deadline?'Deadline':'Next weeks'):''}</svg></div>
    <p class="rx-muted">One light for each week you did the step, or part of it.${g.deadline?' The last one is your deadline.':''}</p></div>`;}

function rGoals(){const r=rD(),act=r.goals.filter(g=>g.status==='active'),paused=r.goals.filter(g=>g.status==='paused');
  const card=g=>{const p=rPlan(g.id);return `<button class="rx-card rx-click" onclick="lpT.rg='${g.id}';go('rGoal',{force:true})"><div class="rx-row">${rIcon(g.area,22)}<p class="rx-eye">${lpEsc((rArea(g.area)||[,'Your goal'])[1])}${g.deadline?' · by '+lpEsc(g.deadline):''}</p></div><b>${lpEsc(g.outcome)}</b>${p?`<span class="rx-muted">Next: ${lpEsc(p.next_action)}</span>`:'<span class="rx-muted">No plan yet</span>'}</button>`;};
  return rShell(`<div class="rx-head rx-row rx-between"><h1>My Goals</h1><button class="rx-btn rx-sm" onclick="rx.newGoal()">New goal</button></div>
    ${act.length?act.map(card).join(''):`<div class="rx-card rx-empty"><b>No goals yet.</b><span class="rx-muted">Start with one. You only need the goal and your very next step.</span><button class="rx-btn" onclick="rx.newGoal()">Start a goal</button></div>`}
    ${paused.length?`<p class="rx-eye" style="margin-top:8px">Paused</p>${paused.map(card).join('')}`:''}`,{tab:'rGoals'});}
function rGoalScreen(){const g=rGoal(lpT.rg);if(!g)return rGoals();const p=rPlan(g.id);
  return rShell(`<div class="rx-head"><div class="rx-row">${rIcon(g.area,22)}<p class="rx-eye">${lpEsc((rArea(g.area)||[,'Goal'])[1])} · ${g.status}</p></div><h1>${lpEsc(g.outcome)}</h1>${g.done_when?`<p class="rx-sub">Done when ${lpEsc(g.done_when)}</p>`:''}</div>
    <div class="rx-card rx-hl"><p class="rx-eye">Your plan</p>${p?`<b>${lpEsc(p.next_action)}</b><span class="rx-muted">${rPlanSentence(p)}</span>`:'<span class="rx-muted">No plan yet. A plan says when, where and how you’ll take the next step.</span>'}
      <div class="rx-row rx-wrapr"><button class="rx-btn" onclick="go('rCheckin',{force:true})">Check in</button><button class="rx-btn rx-ghost" onclick="go('rPlanEdit',{force:true})">${p?'Change the plan':'Add a plan'}</button></div>
      ${p&&p.cue_time&&(p.days||[]).length?`<button class="rx-link" aria-expanded="${lpT.rcal==='p:'+g.id}" onclick="rx.calOpen('p:${g.id}')">Add this plan to my calendar</button>${lpT.rcal==='p:'+g.id?rCalChoices('p',g.id):''}`:''}</div>
    ${rWeekCard(g)}
    ${rGoalPath(g)}
    <div class="rx-row rx-wrapr"><button class="rx-btn rx-ghost rx-sm" onclick="go('rReview',{force:true})">Weekly review</button>

const R_MIN_OTHERS=2;
function rSessKey(s){return s.id+'@'+s.starts_at;}
function rFindSess(id){return (RSS.list||[]).concat([rPilotSlot()]).find(x=>x.id===id);}
function rRsvp(s){const rem=!s.pilot&&RSS.rsvp&&RSS.rsvp[s.id];if(rem)return {known:true,coming:rem.coming,me:rem.me};
  const r=rD(),me=!!(r.rsvps&&r.rsvps[rSessKey(s)]);return {known:false,coming:me?1:0,me};}
function rAttend(s){const a=rRsvp(s),others=Math.max(0,a.coming-(a.me?1:0));

  const dots=a.known&&a.coming?`<span class="rx-att-dots" aria-hidden="true">${Array.from({length:Math.min(a.coming,12)},(_,i)=>`<i class="${a.me&&i===0?'me':''}"></i>`).join('')}</span>`:'';
  return `<div class="rx-att">${dots}<span>${line}</span></div>
    <div class="rx-row rx-wrapr"><button class="rx-btn rx-sm${a.me?' rx-ghost':''}" aria-pressed="${a.me}" ${a.me?'title="Tap to take it back"':''} onclick="rx.rsvp('${s.id}',${!a.me})">${a.me?'✓ You’re going':'I’ll be there'}</button><button class="rx-btn rx-ghost rx-sm" aria-expanded="${lpT.rcal==='s:'+s.id}" onclick="rx.calOpen('s:${s.id}')">Add to calendar</button></div>
    ${lpT.rcal==='s:'+s.id?rCalChoices('s',s.id):''}`;}

/* ---------- Add to calendar: a standard .ics file (Apple, Outlook, most others) or a Google Calendar link. No account linking. ---------- */
const R_DOW=['SU','MO','TU','WE','TH','FR','SA'];
const rPad=n=>String(n).padStart(2,'0');
const rUTC=ms=>{const d=new Date(ms);return d.getUTCFullYear()+rPad(d.getUTCMonth()+1)+rPad(d.getUTCDate())+'T'+rPad(d.getUTCHours())+rPad(d.getUTCMinutes())+'00Z';};
const rLocal=d=>d.getFullYear()+rPad(d.getMonth()+1)+rPad(d.getDate())+'T'+rPad(d.getHours())+rPad(d.getMinutes())+'00';
function rCalSession(s){const st=new Date(s.starts_at).getTime(),en=st+(s.duration_min+(s.extended_min||0))*6e4;
  return {title:'BePhos · '+s.title,start:rUTC(st),end:rUTC(en),utc:true,rrule:s.pilot?'FREQ=WEEKLY;COUNT=12':'',
    details:(s.format==='quiet'?'A quiet session: everyone works on their own thing. ':'')+'Open BePhos to join. The room opens 10 minutes before the start. '+location.origin+'/',location:'BePhos'};}
function rCalPlan(g){const p=rPlan(g.id);if(!p||!p.cue_time||!(p.days||[]).length)return null;const [hh,mm]=p.cue_time.split(':').map(Number);
  const d=new Date();d.setHours(hh,mm||0,0,0);for(let i=0;i<8;i++){if(p.days.includes(d.getDay())&&d.getTime()>Date.now())break;d.setDate(d.getDate()+1);d.setHours(hh,mm||0,0,0);}
  const e=new Date(d.getTime()+(p.minutes||25)*6e4);
  return {title:'BePhos · '+p.next_action,start:rLocal(d),end:rLocal(e),utc:false,rrule:'FREQ=WEEKLY;BYDAY='+p.days.slice().sort().map(n=>R_DOW[n]).join(','),
    details:'For: '+g.outcome+(p.obstacle_if&&p.obstacle_then?'. If '+p.obstacle_if+', then '+p.obstacle_then+'.':'')+' Check in on BePhos afterwards: '+location.origin+'/',location:p.cue_place||''};}
function rCalEvent(kind,id){return kind==='s'?(rFindSess(id)?rCalSession(rFindSess(id)):null):(rGoal(id)?rCalPlan(rGoal(id)):null);}
function rGcal(ev){let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';}catch(e){}
  const q=new URLSearchParams({action:'TEMPLATE',text:ev.title,dates:ev.start+'/'+ev.end,details:ev.details,location:ev.location});if(ev.rrule)q.set('recur','RRULE:'+ev.rrule);if(!ev.utc&&tz)q.set('ctz',tz);
  return 'https://calendar.google.com/calendar/render?'+q.toString();}
function rIcs(ev){const esc=t=>String(t||'').replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');

.rx-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.rx-area{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer;min-height:108px;transition:border-color .15s,transform .15s;}
.rx-area:hover{border-color:var(--accent);transform:translateY(-1px);}.rx-area.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent);}
.rx-area b{font:600 14.5px/1.25 Figtree,sans-serif;}.rx-area small{font-size:12px;color:var(--soft);line-height:1.35;}
.rx-ic{flex:none;transition:transform .2s;}.rx-area:hover .rx-ic{transform:scale(1.08);}
.rx-rail{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.rx-chips{display:flex;gap:8px;flex-wrap:wrap;}
.rx-chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:38px;display:inline-flex;align-items:center;font:500 13px Figtree,sans-serif;background:transparent;color:var(--ink);cursor:pointer;}
.rx-chip.rx-sm{min-height:32px;font-size:12px;padding:0 11px;}
.rx-chip.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600;}
.rx-chip.rx-och.on{border-color:var(--ochre);background:var(--ochre-soft);}
.rx-ideas{display:flex;flex-wrap:wrap;gap:8px;}
.rx-idea{border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:500 13.5px/1.3 Figtree,sans-serif;background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;min-height:40px;}
.rx-idea.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft);}
.rx-label{font:600 13px Figtree,sans-serif;color:var(--ink);margin:4px 0 -4px;display:block;}
.rx-field{width:100%;border:1px solid var(--line);border-radius:12px;padding:0 14px;min-height:46px;font:15px Figtree,sans-serif;color:var(--ink);background:var(--field);}
textarea.rx-field{padding:11px 14px;min-height:64px;resize:vertical;}
.rx-field::placeholder{color:var(--soft);}
.rx-f{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;}
.rx-more{border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:8px;}
.rx-more summary{cursor:pointer;font:600 14px Figtree,sans-serif;min-height:30px;}
.rx-more[open]{display:flex;}.rx-more[open]>*:not(summary){margin-top:6px;}
.rx-err{color:var(--bad);font-size:14px;min-height:18px;}
.rx-daypick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
.rx-dy{min-height:42px;border-radius:10px;border:1px dashed var(--soft);background:transparent;color:var(--soft);font:600 13px Figtree,sans-serif;cursor:pointer;}
.rx-dy.on{background:var(--accent);border:1px solid var(--accent);color:var(--on-accent);}
.rx-opt{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer;position:relative;}
.rx-opt b{font:600 15px Figtree,sans-serif;}.rx-opt span{font-size:13px;color:var(--soft);}
.rx-opt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent);}
.rx-opt.on::after{content:"";position:absolute;right:18px;top:50%;width:9px;height:17px;margin-top:-11px;border:solid var(--accent-text);border-width:0 2.5px 2.5px 0;transform:rotate(45deg);}
.rx-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
.rx-d{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 11px Figtree,sans-serif;color:var(--soft);}
.rx-d i{width:26px;height:26px;border-radius:50%;display:block;background:transparent;border:1.5px dashed var(--line);}
.rx-d i.s-planned{border:1.5px solid var(--line);background:radial-gradient(circle,var(--soft) 0 3px,transparent 3.5px);}
.rx-d i.s-missed{border:1.5px solid var(--soft);}
.rx-d i.s-completed{background:var(--accent);border-color:var(--accent);}
.rx-d i.s-partial{background:linear-gradient(90deg,var(--accent) 50%,var(--track) 50%);border-color:var(--accent);}
.rx-d i.s-blocked,.rx-d i.s-rescheduled{border:2px solid var(--ochre);}
.rx-d.today span{color:var(--ink);font-weight:700;}
.rx-d.today span::after{content:'';display:block;height:2px;margin-top:2px;border-radius:2px;background:var(--accent);}
.rx-cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center;}
.rx-cmp div{display:flex;flex-direction:column;gap:2px;padding:10px 4px;border-radius:12px;background:var(--track);}
.rx-cmp b{font:600 26px 'Bricolage Grotesque',Figtree,system-ui,sans-serif;font-variant-numeric:tabular-nums;}.rx-cmp span{font-size:12px;color:var(--soft);}
.rx-tag{font:600 11px Figtree,sans-serif;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);white-space:nowrap;}
.rx-t-paused,.rx-t-retired{background:var(--ochre-soft);color:var(--ochre-text);}
.rx-live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;animation:rxPulse 2s ease-in-out infinite;}
@keyframes rxPulse{0%,100%{box-shadow:0 0 0 0 rgba(107,191,126,.5)}50%{box-shadow:0 0 0 6px rgba(107,191,126,0)}}
.rx-kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:14px;}.rx-kv dt{color:var(--soft);}.rx-kv dd{margin:0;font-weight:600;}
.rx-timer{font:600 clamp(64px,22vw,96px)/1 'Bricolage Grotesque',Figtree,system-ui,sans-serif;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0 0;color:var(--ink);}
.rx-note{align-self:center;font:600 13px Figtree,sans-serif;color:var(--ochre-text);background:var(--ochre-soft);padding:6px 12px;border-radius:999px;}
.rx-person{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}.rx-person:last-of-type{border-bottom:0;}
.rx-seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--track);}
.rx-seg button{min-height:40px;border-radius:10px;border:0;background:transparent;font:600 12px Figtree,sans-serif;color:var(--soft);cursor:pointer;}
.rx-seg button.on{background:var(--accent);color:var(--on-accent);}
.rx-set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;width:100%;}
.rx-set:disabled{cursor:default;opacity:1;}
.rx-set b{font:600 14px Figtree,sans-serif;display:block;}.rx-set small{font-size:12.5px;color:var(--soft);display:block;margin-top:2px;line-height:1.4;}
.rx-val{font:600 13px Figtree,sans-serif;color:var(--accent-text);white-space:nowrap;}
.rx-check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer;}.rx-check input{width:20px;height:20px;margin:2px 0 0;accent-color:#6BBF7E;flex:none;}
.rx-tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;background:var(--bg);border-top:1px solid var(--line);padding:6px max(4px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));}
.rx-tab{flex:1;max-width:112px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:50px;justify-content:center;background:none;border:0;font:500 11px Figtree,sans-serif;color:var(--soft);cursor:pointer;}
.rx-tab svg{width:22px;height:22px;}.rx-tab.on{color:var(--ink);font-weight:700;}.rx-tab.on svg{color:var(--accent-text);}
@media (prefers-reduced-motion:reduce){.rx-live{animation:none}.rx-way,.rx-area,.rx-ic{transition:none}}
/* Torch stage: always dark, because fire needs night. --fl is the live flicker, set from the flame. */
.rx-stage{position:relative;border-radius:22px;overflow:hidden;background:#0D0C0C;height:440px;isolation:isolate;--fl:1;}
.rx-amb{position:absolute;inset:0;z-index:0;background:radial-gradient(60% 46% at 50% 44%,rgba(var(--warm),calc(.20*var(--fl))) 0%,rgba(var(--warm),calc(.07*var(--fl))) 45%,transparent 75%),radial-gradient(120% 60% at 50% 110%,#151B17,transparent 70%);}
.rx-fire{position:absolute;left:50%;top:-18px;transform:translateX(-50%);z-index:2;width:240px;height:290px;pointer-events:none;}
.rx-sparks{position:absolute;inset:0;z-index:3;pointer-events:none;width:100%;height:100%;}
.rx-torch{position:absolute;left:50%;top:238px;transform:translateX(-50%);z-index:1;width:120px;height:90px;}
.rx-stage .rx-timer{position:absolute;left:0;right:0;bottom:46px;z-index:4;margin:0;font-size:58px;color:#FBEBD6;text-shadow:0 0 calc(18px*var(--fl)) rgba(var(--warm),.45);}
.rx-stage .rx-timer.rx-ended{font-size:44px;}
.rx-st-sub{position:absolute;left:16px;right:16px;bottom:20px;text-align:center;z-index:4;color:#C9BBA6;font-size:13px;}
.rx-burn{position:absolute;left:24px;right:24px;bottom:9px;height:2px;border-radius:2px;background:rgba(255,255,255,.08);z-index:4;overflow:hidden;}
.rx-burn i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,rgba(var(--warm),.2),rgba(var(--warm),.95));box-shadow:0 0 8px rgba(var(--warm),.8);transition:width 1s linear;}
.rx-st-top{position:absolute;top:16px;left:16px;right:16px;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:8px;color:#C9BBA6;font-size:12px;}
.rx-others{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;}
.rx-others i{width:8px;height:8px;border-radius:50%;background:#A7B8AB;box-shadow:0 0 8px 2px rgba(167,184,171,.6);animation:rxBreathe 3.6s ease-in-out infinite;}
.rx-others i.me{background:#FFD08A;box-shadow:0 0 8px 2px rgba(255,170,80,.6);}
.rx-others i:nth-child(3n+2){animation-delay:-1.2s}.rx-others i:nth-child(3n){animation-delay:-2.1s}
@keyframes rxBreathe{0%,100%{opacity:.55;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
/* Week lamps */
.rx-lamps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;align-items:end;margin:8px 0 4px;position:relative;}
.rx-lamps::after{content:"";position:absolute;left:0;right:0;bottom:22px;height:1px;background:var(--line);}
.rx-lamp{display:grid;justify-items:center;gap:6px;position:relative;z-index:1;}
.rx-lamp>span{font:500 11px Figtree,sans-serif;color:var(--soft);}
.rx-lamp.today>span{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;}
.rx-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
.rx-post{position:relative;width:26px;height:64px;}
.rx-pole{position:absolute;left:12px;bottom:0;width:2px;height:40px;border-radius:1px;background:linear-gradient(#57524D,#3D3935);}
.rx-cap{position:absolute;left:5px;top:6px;width:16px;height:3px;border-radius:2px;background:#57524D;}
.rx-glass{position:absolute;left:7px;top:9px;width:12px;height:15px;border-radius:3px 3px 5px 5px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid #4D4844;}
.rx-bloom{position:absolute;left:-17px;top:-15px;width:60px;height:60px;border-radius:50%;opacity:0;pointer-events:none;background:radial-gradient(circle,rgba(255,214,150,.75) 0%,rgba(var(--warm),.32) 28%,rgba(var(--warm),0) 65%);}
.rx-pool{position:absolute;left:-12px;bottom:-6px;width:50px;height:14px;border-radius:50%;opacity:0;background:radial-gradient(ellipse,rgba(var(--warm),.35),transparent 70%);}
.rx-light .rx-pole{background:linear-gradient(#B5AEA6,#64786A);}.rx-light .rx-cap{background:#64786A;}
.rx-light .rx-lamp:not(.rx-l-on):not(.rx-l-half) .rx-glass{border-color:#D6D1CB;background:linear-gradient(180deg,#F7F8F6,#E9ECE7);}
.rx-light .rx-bloom{mix-blend-mode:multiply;background:radial-gradient(circle,rgba(var(--warm),.55) 0%,rgba(var(--warm),.18) 30%,rgba(var(--warm),0) 65%);}
.rx-l-on .rx-glass{background:radial-gradient(circle at 50% 55%,#FFF8EC 0%,rgb(var(--warm)) 55%,rgba(var(--warm),.75) 100%);border-color:rgb(var(--warm));box-shadow:0 0 6px 1px rgba(var(--warm),.9);}
.rx-light .rx-l-on .rx-glass{background:radial-gradient(circle at 50% 55%,#FFF1D8 0%,rgb(var(--warm)) 50%,rgba(var(--warm),.85) 100%);}
.rx-l-on .rx-bloom{opacity:1;animation:rxFlick 3.2s infinite;}.rx-l-on .rx-pool{opacity:1;}
.rx-l-half .rx-glass{background:radial-gradient(circle at 50% 70%,rgba(var(--warm),.95) 0%,rgba(var(--warm),.55) 60%,rgba(40,30,20,.9) 100%);border-color:rgba(var(--warm),.7);box-shadow:0 0 4px rgba(var(--warm),.6);}
.rx-l-half .rx-bloom{opacity:.45;animation:rxFlick 3.8s infinite;}.rx-l-half .rx-pool{opacity:.45;}
.rx-lamp.rx-l-moved .rx-glass{border:1.5px dashed var(--accent-text);background:transparent;}
.rx-lamp.rx-l-blocked .rx-glass{border:1.5px solid var(--ochre);background:transparent;}
.rx-l-blocked .rx-glass::after{content:"";position:absolute;left:3.5px;bottom:3px;width:3px;height:3px;border-radius:50%;background:var(--ochre);box-shadow:0 0 5px var(--ochre);}
.rx-l-dark .rx-glass{border-color:var(--soft);}
.rx-l-rest .rx-post{opacity:.28;}
.rx-l-planned .rx-glass::after{content:"";position:absolute;left:4px;top:5px;width:2px;height:2px;border-radius:50%;background:var(--soft);opacity:.8;}
@keyframes rxFlick{0%,100%{opacity:1}12%{opacity:.86}15%{opacity:1}48%{opacity:.93}52%{opacity:1}77%{opacity:.88}80%{opacity:1}}
.rx-ignite .rx-glass{animation:rxIgG 1.1s ease-out both;}
.rx-ignite .rx-bloom{animation:rxIgB 1.4s ease-out both,rxFlick 3.2s 1.4s infinite;}
.rx-ignite .rx-pool{animation:rxIgP 1.4s ease-out both;}
@keyframes rxIgG{0%{filter:brightness(.2)}18%{filter:brightness(.5)}24%{filter:brightness(.25)}40%{filter:brightness(1.9)}100%{filter:brightness(1)}}
@keyframes rxIgB{0%{opacity:0;transform:scale(.3)}18%{opacity:.5;transform:scale(.6)}24%{opacity:.15}45%{opacity:1;transform:scale(1.5)}100%{opacity:1;transform:scale(1)}}
@keyframes rxIgP{0%,30%{opacity:0;transform:scaleX(.4)}100%{opacity:1;transform:scaleX(1)}}
/* Goal path */
.rx-path{color:var(--soft);margin:4px 0 2px;}.rx-path svg{width:100%;height:auto;display:block;overflow:visible;}
.rx-path text{font:500 10px Figtree,sans-serif;fill:var(--soft);}
.rx-pd{fill:var(--surface);stroke:#4D4844;stroke-width:1.5;}.rx-light .rx-pd{stroke:#D6D1CB;}
.rx-pd.lit{fill:rgb(var(--warm));stroke:rgb(var(--warm));}.rx-pd.touched{stroke:var(--ochre);}
.rx-pd.now{stroke:var(--accent-text);stroke-width:2.5;}
@media (prefers-reduced-motion:reduce){.rx-others i,.rx-l-on .rx-bloom,.rx-l-half .rx-bloom,.rx-ignite .rx-glass,.rx-ignite .rx-bloom,.rx-ignite .rx-pool{animation:none}.rx-burn i{transition:none}}

:root{--warm:255,170,80;}
/* Lights (session room and picker). The flame canvas reaches 40 units above the 200-unit box. */
.rx-vis{position:relative;}
.rx-vis svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.rx-vis canvas.rx-flm{position:absolute;left:0;top:-20%;width:100%;height:120%;}
.rx-stage .rx-vis{position:absolute;left:50%;top:22px;width:260px;height:260px;transform:translateX(-50%);z-index:2;}
.rx-lit{fill:rgb(var(--warm));opacity:calc(.92*var(--fl,1));}
.rx-litsoft{fill:rgb(var(--warm));opacity:calc(.28*var(--fl,1));}
.rx-rim{fill:url(#rxgRim);opacity:calc(.9*var(--fl,1));}
.rx-ol{stroke:rgba(255,255,255,.28);stroke-width:1.1;stroke-linejoin:round;}
.rx-olb{stroke:#E6C48C;stroke-opacity:.55;stroke-width:1.1;stroke-linejoin:round;}
.rx-olw{stroke:#B98258;stroke-opacity:.8;stroke-width:1.1;stroke-linejoin:round;}
.rx-dk{stroke:#07090A;stroke-opacity:.55;stroke-width:.9;fill:none;}
.rx-lp{display:flex;flex-direction:column;gap:12px;--fl:1;}
.rx-lp-stage{position:sticky;top:0;z-index:5;border-radius:20px;overflow:hidden;background:#0D0C0C;height:310px;isolation:isolate;}
.rx-lp-amb{position:absolute;inset:0;background:radial-gradient(55% 55% at 50% 48%,rgba(var(--warm),calc(.22*var(--fl))),rgba(var(--warm),calc(.06*var(--fl))) 50%,transparent 78%);}
.rx-lp-pv{position:absolute!important;left:50%;top:26px;width:220px;height:220px;transform:translateX(-50%);}
.rx-lp-cap{position:absolute;left:16px;right:16px;bottom:14px;text-align:center;color:#F1E4D0;}
.rx-lp-cap b{display:block;font:600 17px/1.3 'Bricolage Grotesque',Figtree,system-ui,sans-serif;}.rx-lp-cap span{font-size:12.5px;color:#C9BBA6;}
.rx-lp-tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;}
.rx-lp-tabs button{flex:1;border:0;border-radius:999px;padding:9px 8px;font:600 14px Figtree,sans-serif;background:transparent;color:var(--soft);cursor:pointer;}
.rx-lp-tabs button.on{background:var(--accent);color:var(--on-accent);}.rx-lp-tabs small{font-weight:500;opacity:.8;}
.rx-lp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
@media(min-width:620px){.rx-lp-grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
.rx-lp-opt{display:flex;flex-direction:column;justify-content:flex-start;position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:0 0 12px;cursor:pointer;font:inherit;overflow:hidden;}
.rx-lp-opt.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.rx-tick{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:none;place-items:center;z-index:3;}
.rx-lp-opt.on .rx-tick{display:grid;}
.rx-lp-th{position:relative;height:128px;background:#0E120F;flex:none;}
.rx-lp-th::before{content:"";position:absolute;inset:0;background:radial-gradient(50% 55% at 50% 50%,rgba(var(--warm),calc(.16*var(--fl))),transparent 75%);}
.rx-lp-th .rx-vis{position:absolute;left:50%;top:10px;width:112px;height:112px;transform:translateX(-50%);}
.rx-lp-opt b{display:block;padding:10px 12px 2px;font-size:14.5px;}
.rx-lp-opt p{margin:0;padding:0 12px;color:var(--soft);font-size:12.5px;line-height:1.4;}
.rx-lp-fire .rx-lp-th{height:92px;}.rx-lp-fire .rx-lp-th canvas{position:absolute;left:50%;top:2px;width:76px;height:88px;transform:translateX(-50%);}
.rx-lp-chem{display:block;padding:0 12px;font-size:11.5px;color:var(--soft);}.rx-lp-why{display:block;padding:6px 12px 0;font-size:12.5px;}
.rx-a{color:var(--accent-text);}
/* Goal picker: 1 goal, 2 next step */
.rx-gp-area{display:flex;align-items:center;gap:10px;color:var(--soft);font-size:13px;}.rx-gp-area b{color:var(--ink);font-weight:600;}
.rx-gp-area button{margin-left:auto;background:none;border:0;color:var(--accent-text);font:600 13px Figtree,sans-serif;cursor:pointer;padding:6px 0;}
.rx-part{display:flex;align-items:center;gap:10px;margin:8px 0 0;}
.rx-part .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 13px Figtree,sans-serif;background:var(--accent);color:var(--on-accent);}
.rx-part .n.off{background:transparent;border:1.5px solid var(--line);color:var(--soft);}
.rx-part h2{font:600 17px Figtree,sans-serif;margin:0;}.rx-part span{display:block;color:var(--soft);font-size:13px;}
.rx-grp{font:600 11.5px Figtree,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--soft);margin:10px 0 -2px;}
.rx-plist{display:grid;gap:8px;}@media(min-width:620px){.rx-plist{grid-template-columns:1fr 1fr;}}
.rx-pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:13px 14px;font:500 14.5px/1.35 Figtree,sans-serif;cursor:pointer;}
.rx-pick .r{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--soft);display:grid;place-items:center;}

  --lm-teal:#B9C6BC;--lm-teal-hv:#A3B3A6;--lm-teal-dk:#404742;--lm-veil:rgba(234,243,232,.86);--lm-veil2:rgba(226,237,224,.9);--lp-ink:#122016;}

body.lp-on{--lp-bg:#F2F7EF;--lp-surface:#FFFFFF;--lp-surface2:#E2E8E0;--lp-line:#D5DBD3;--lp-ink:#122016;--lp-muted:#5A6A5E;--lp-faint:#64786A;--lp-cta:#6BBF7E;--lp-cta-ink:#0D1F12;--lp-cta-dk:#2E7A42;--lp-ground:#E2E8E0;}

.rx-att{display:flex;align-items:center;gap:10px;font-size:14px;}

/* Round 1 (Fern): headings in Bricolage Grotesque */
.rx h1,.rx h2,.rx .rx-head h1{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif;letter-spacing:-.02em;}
.rx-seg2{margin:2px 0 4px;}
/* Commons: three small night skies, each with its own sun */
.rx-suns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.rx-sun{position:relative;overflow:hidden;background:#12211A;color:#E6F0E8;border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:12px 11px 11px;display:flex;flex-direction:column;gap:3px;min-height:118px;justify-content:flex-end;}
.rx-sun b{font:700 13px/1.15 'Bricolage Grotesque',Figtree,sans-serif;position:relative;}
.rx-sun>span:last-child{font-size:11.5px;line-height:1.3;color:#9DB3A4;position:relative;}
.rx-sky{position:absolute;inset:0;pointer-events:none;opacity:.55;animation:rxTw 5s ease-in-out infinite;
 background:radial-gradient(1px 1px at 18% 72%,#fff 60%,transparent),radial-gradient(1px 1px at 42% 88%,#fff 60%,transparent),radial-gradient(1.2px 1.2px at 70% 64%,#fff 60%,transparent),radial-gradient(1px 1px at 88% 84%,#fff 60%,transparent),radial-gradient(1px 1px at 30% 40%,#fff 60%,transparent),radial-gradient(1px 1px at 56% 30%,#fff 60%,transparent);}
@keyframes rxTw{50%{opacity:.15;}}
.rx-sunb{position:absolute;right:11px;top:11px;width:28px;height:28px;}
.rx-sunb i{position:absolute;display:block;}
.rx-cor{inset:-11px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 8%,var(--g) 12%,transparent 18% 33%,var(--g) 40%,transparent 46% 60%,var(--g) 68%,transparent 74% 86%,var(--g) 92%,transparent 98%);
 -webkit-mask:radial-gradient(closest-side,#000 30%,transparent 100%);mask:radial-gradient(closest-side,#000 30%,transparent 100%);opacity:.75;filter:blur(3px);animation:rxSpin 24s linear infinite;}
.rx-cor.rx-c2{inset:-7px;opacity:.35;animation-duration:36s;animation-direction:reverse;}
.rx-core{left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fff,var(--g));box-shadow:0 0 9px 3px var(--g);animation:rxPulse 4s ease-in-out infinite;}
.rx-orb{inset:-2px;border-radius:50%;border:1px solid rgba(255,255,255,.12);animation:rxSpin 9s linear infinite;}
.rx-orb i{left:50%;top:-1.5px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px var(--g);}
.rx-sun:nth-child(2) .rx-orb{animation-duration:12s;animation-delay:-4s;}.rx-sun:nth-child(3) .rx-orb{animation-duration:7s;animation-delay:-2s;}
.rx-sun:nth-child(2) .rx-core{animation-delay:-1.3s;}.rx-sun:nth-child(3) .rx-core{animation-delay:-2.6s;}
@keyframes rxSpin{to{transform:rotate(360deg);}}
@keyframes rxPulse{50%{transform:scale(1.15);}}
/* Bonfire */
.rx-bonfire{background:#12211A;color:#E6F0E8;border-radius:22px;padding:18px 16px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;}
.rx-bonfire b{font:700 19px/1.2 'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.01em;}
.rx-bonfire span{font-size:13.5px;line-height:1.45;color:#9DB3A4;max-width:34ch;}
.rx-fl{transform-box:fill-box;transform-origin:50% 100%;animation:rxFlick 1.9s ease-in-out infinite;}
.rx-fl2{animation-duration:1.4s;animation-delay:-.4s;}.rx-fl3{animation-duration:1.1s;animation-delay:-.7s;}
@keyframes rxFlick{0%,100%{transform:scale(1,1) skewX(0);}30%{transform:scale(.96,1.06) skewX(-2deg);}60%{transform:scale(1.03,.95) skewX(2deg);}}
@media (prefers-reduced-motion:reduce){.rx-sky,.rx-cor,.rx-core,.rx-orb,.rx-fl{animation:none;}}
